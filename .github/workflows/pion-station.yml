  workflow_dispatch:

concurrency:
  group: pion-station-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  c-shims:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/node

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Validate toolchain pin, scripts, and stdio smoke harness self-test
        run: |
          sha="$(sed -n 's/[[:space:]]*#.*$//; /^[[:space:]]*$/d; p; q' pion/station/TOOLCHAIN | tr -d '[:space:]')"
          test "${#sha}" -eq 40
          sh -n pion/station/scripts/ensure-pionc.sh
          bash -n pion/station/scripts/build.sh
          node pion/station/scripts/smoke-stdio-test.mjs

      - name: C shims strict compile, ASan/UBSan, TSan, and win32-x64 cross-compile
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test"
          "$RUNNER_TEMP/station_sqlite_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test_asan"
          "$RUNNER_TEMP/station_sqlite_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c \
            pion/station/packages/sqlite_ffi/native/station_sqlite_test.c \
            -lpthread -o "$RUNNER_TEMP/station_sqlite_test_tsan"
          "$RUNNER_TEMP/station_sqlite_test_tsan"

          cc -std=c11 -O2 -Wall -Wextra -Werror \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test"
          "$RUNNER_TEMP/host_shim_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test_asan"
          "$RUNNER_TEMP/host_shim_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/host_shim/native/station_host.c \
            pion/station/packages/host_shim/native/host_shim_test.c \
            -lpthread -o "$RUNNER_TEMP/host_shim_test_tsan"
          "$RUNNER_TEMP/host_shim_test_tsan"

          cc -std=c11 -O2 -Wall -Wextra -Werror -DNDEBUG \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test"
          "$RUNNER_TEMP/footprint_fs_test"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test_asan"
          "$RUNNER_TEMP/footprint_fs_test_asan"

          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=thread -fno-omit-frame-pointer \
            pion/station/packages/footprint/native/footprint_fs.c \
            pion/station/packages/footprint/native/footprint_fs_test.c \
            -o "$RUNNER_TEMP/footprint_fs_test_tsan"
          "$RUNNER_TEMP/footprint_fs_test_tsan"

          # Verify _WIN32 compilation path on every CI run with pinned Zig 0.16.0.
          zbase="$HOME/.cache/pion-station-zig/0.16.0"
          zbin="$zbase/zig-x86_64-linux-0.16.0/zig"
          if [ ! -x "$zbin" ]; then
            mkdir -p "$zbase"
            tmp="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 \
              -o "$tmp" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $tmp" | sha256sum -c --quiet
            tar -xf "$tmp" -C "$zbase"
            rm -f "$tmp"
          fi
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/host_shim/native/station_host.c -o "$RUNNER_TEMP/station_host_win.o"
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/sqlite_ffi/native/station_sqlite.c -o "$RUNNER_TEMP/station_sqlite_win.o"
          "$zbin" cc -target x86_64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -c \
            pion/station/packages/footprint/native/footprint_fs.c -o "$RUNNER_TEMP/footprint_fs_win.o"

  pion-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify access to AFK-surf/pion and AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            exit 0
          fi
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion.git HEAD >/dev/null 2>&1 && \
             GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion-packages.git HEAD >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error::AFK-surf/pion or AFK-surf/pion-packages is private and PION_TOKEN is not configured."
          exit 1

      - name: Cache pinned Pion toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Ensure pinned pionc toolchain
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          ENV_OUT="$(sh pion/station/scripts/ensure-pionc.sh --print-env)" || exit $?
          eval "$ENV_OUT"
          echo "$(dirname "$PIONC")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC" >> "$GITHUB_ENV"
          "$PIONC" --version

      - name: Pion fmt, check, and unit tests
        run: |
          "$PIONC" fmt --check pion/station
          "$PIONC" check --json pion/station
          "$PIONC" test --json pion/station

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Verify access to AFK-surf/pion and AFK-surf/pion-packages (fail loudly on missing PION_TOKEN)
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            exit 0
          fi
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion.git HEAD >/dev/null 2>&1 && \
             GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code https://github.com/AFK-surf/pion-packages.git HEAD >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error::AFK-surf/pion or AFK-surf/pion-packages is private and PION_TOKEN is not configured in AFK-surf/monoid repository secrets."
          exit 1

      - name: Cache pinned Pion toolchain
        id: pion-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-toolchain
          key: pion-station-toolchain-linux-x64-v1-${{ hashFiles('pion/station/TOOLCHAIN') }}

      - name: Cache Zig 0.16.0
        uses: actions/cache@v4
        with:
          path: ~/.cache/pion-station-zig/0.16.0
          key: pion-station-zig-linux-x64-0.16.0

      - name: Cache Zig compilation artifacts
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/zig
          key: pion-station-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station/**') }}
          restore-keys: pion-station-zig-cache-linux-x64-0.16.0-

      - name: Configure git credentials for private AFK-surf/pion-packages
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          if [ -n "${PION_TOKEN:-}" ]; then
            auth_b64="$(printf 'x-access-token:%s' "$PION_TOKEN" | base64 | tr -d '\n\r')"
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_b64"
          fi

      - name: Ensure pinned pionc toolchain
        env:
          PION_TOKEN: ${{ secrets.PION_TOKEN }}
        run: |
          ENV_OUT="$(sh pion/station/scripts/ensure-pionc.sh --print-env)" || exit $?
          eval "$ENV_OUT"
          echo "$(dirname "$PIONC")" >> "$GITHUB_PATH"
          echo "PIONC=$PIONC" >> "$GITHUB_ENV"
          echo "PION_QBE=$PION_QBE" >> "$GITHUB_ENV"
          echo "PION_TOOLCHAIN_DIR=$PION_TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "PION_RT_DIR=$PION_RT_DIR" >> "$GITHUB_ENV"
          "$PIONC" --version

      - name: Whether this commit's MoonBit reader is prebuilt
        id: reader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing="$(node scripts/native.ts missing reader:linux-x64)"
          echo "missing=$([ -n "$missing" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.reader.outputs.missing == 'true'
        uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc', farview: 'false' }

      - name: Zig 0.16.0 for the reader (UBSan off at -O0, as natives)
        if: steps.reader.outputs.missing == 'true'
        run: |
          zbase="$HOME/.cache/pion-station-zig/0.16.0"
          d="$zbase/zig-x86_64-linux-0.16.0"
          if [ ! -x "$d/zig" ]; then
            mkdir -p "$zbase"
            t="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 -o "$t" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $t" | sha256sum -c --quiet
            tar -xf "$t" -C "$zbase"
            rm -f "$t"
          fi
          [ "$("$d/zig" version)" = 0.16.0 ]
          mkdir -p "$RUNNER_TEMP/zig-bin"
          printf '#!/bin/sh\nif [ "${1:-}" = cc ]; then shift; exec "%s/zig" cc -fno-sanitize=undefined "$@"; fi\nexec "%s/zig" "$@"\n' "$d" "$d" > "$RUNNER_TEMP/zig-bin/zig"
          chmod +x "$RUNNER_TEMP/zig-bin/zig"

      - if: steps.reader.outputs.missing == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/stillfail-reader-mbc
          key: mbui-reader-linux-branch-v2-${{ github.sha }}
          restore-keys: mbui-reader-linux-branch-v2-

      - name: Build linux-x64 Pion + MB reader binaries, run smoke suite, and stage artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/pion-station-bins"
          mkdir -p "$STAGE"
          BIN_PION="$STAGE/stillfail-pion-linux-x64"
          BIN_MB="$STAGE/stillfail-reader-linux-x64"

          bash pion/station/scripts/build.sh linux-x64 "$BIN_PION"
          ls -lh "$BIN_PION"
          ldd "$BIN_PION"

          # Strictly verify max GLIBC symbol version <= 2.28 (never swallow objdump errors).
          objdump_out="$(objdump -T "$BIN_PION")"
          max_glibc="$(printf '%s\n' "$objdump_out" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1 || true)"
          echo "max_glibc=${max_glibc:-none}"
          test -n "$max_glibc"
          ver="${max_glibc#GLIBC_}"
          top="$(printf '%s\n2.28\n' "$ver" | sort -V | tail -n 1)"
          if [ "$top" != "2.28" ]; then
            echo "FAIL: binary requires $max_glibc (> GLIBC_2.28)" >&2
            exit 1
          fi

          "$BIN_PION" --version
          node pion/station/scripts/smoke-stdio.mjs "$BIN_PION"
          "$BIN_PION" --smoke-sqlite "$RUNNER_TEMP/smoke.db"
          "$BIN_PION" --smoke-sql-db "$RUNNER_TEMP/smoke-sql-db.db"
          "$BIN_PION" --smoke-shell "$RUNNER_TEMP/shell-dir"
          "$BIN_PION" --smoke-rc-soak 50000

          # Acquire this SHA's real MoonBit stillfail-reader-linux-x64 once for all downstream gate jobs.
          if [ "${{ steps.reader.outputs.missing }}" = "true" ]; then
            MB_SRC="$(PATH="$RUNNER_TEMP/zig-bin:$PATH" MBC_UNIT_KB=8192 MBC_INIT_SPLIT=0 node scripts/native.ts run reader -- sh -c 'printf "%s" "$STILLFAIL_MB_READER"')"
          else
            MB_SRC="$(node scripts/native.ts file reader linux-x64)"
          fi
          test -x "$MB_SRC"
          cp "$MB_SRC" "$BIN_MB"
          chmod +x "$BIN_MB" "$BIN_PION"
          ls -lh "$BIN_MB"

          (cd "$STAGE" && sha256sum stillfail-pion-linux-x64 stillfail-reader-linux-x64 > SHA256SUMS)
          cat "$STAGE/SHA256SUMS"

      - name: Upload Linux binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: pion-station-linux-bins
          path: ${{ runner.temp }}/pion-station-bins
          retention-days: 1

      - name: Save Zig cache
        if: always() && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.cache/zig
          key: pion-station-zig-cache-linux-x64-0.16.0-${{ hashFiles('pion/station/**') }}

  gate-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build-linux
    if: needs.build-linux.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Download and verify Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-artifact.sh "$GITHUB_RUN_ID" pion-station-linux-bins "$RUNNER_TEMP/bins"
          (cd "$RUNNER_TEMP/bins" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/bins/stillfail-pion-linux-x64" "$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          test "$(realpath "$RUNNER_TEMP/bins/stillfail-pion-linux-x64")" != "$(realpath "$RUNNER_TEMP/bins/stillfail-reader-linux-x64")"

      # (the footprint tests mount a tmpfs in a user namespace, which Ubuntu 24.04's AppArmor keeps from a user's)
      - run: sudo -n sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run selector/config, footprint, memory, and packed gates
        run: |
          set -euo pipefail
          BIN_PION="$RUNNER_TEMP/bins/stillfail-pion-linux-x64"
          BIN_MB="$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          pnpm --dir station install --frozen-lockfile --prefer-offline

          node --test station/test/reader-contract-select.test.ts station/test/reader-config-select.test.ts

          STILLFAIL_READER_CANDIDATE="$BIN_PION" node --test station/test/reader-contract-footprint.test.ts
          STILLFAIL_MB_READER="$BIN_PION" node --test station/test/mb-footprint.test.ts
          STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" node --test station/test/footprint-pion-switch.test.ts

          STILLFAIL_READER_CANDIDATE="$BIN_PION" node --test station/test/reader-contract-memory.test.ts
          STILLFAIL_MB_READER="$BIN_PION" node --test station/test/mb-memory-merge.test.ts
          STILLFAIL_MB_READER="$BIN_PION" node --test station/test/mb-share-skills.test.ts
          STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" node --test station/test/memory-pion-switch.test.ts

          STILLFAIL_READER_CANDIDATE="$BIN_PION" node --test station/test/reader-contract-packed.test.ts
          STILLFAIL_MB_READER="$BIN_PION" node --test station/test/mb-packed.test.ts
          STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" node --test station/test/packed-pion-switch.test.ts

  gate-sqlite-w14:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build-linux
    if: needs.build-linux.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Download and verify Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-artifact.sh "$GITHUB_RUN_ID" pion-station-linux-bins "$RUNNER_TEMP/bins"
          (cd "$RUNNER_TEMP/bins" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/bins/stillfail-pion-linux-x64" "$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          test "$(realpath "$RUNNER_TEMP/bins/stillfail-pion-linux-x64")" != "$(realpath "$RUNNER_TEMP/bins/stillfail-reader-linux-x64")"

      - name: Run Wave 4 SQLite builder contracts, mb-* compatibility, and dual-engine switch gates
        run: |
          set -euo pipefail
          BIN_PION="$RUNNER_TEMP/bins/stillfail-pion-linux-x64"
          BIN_MB="$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          pnpm --dir station install --frozen-lockfile --prefer-offline

          STILLFAIL_MB_READER="$BIN_PION" node -e 'import { resolve } from "node:path"; import { mbReaderBinary } from "./station/src/read/mb-reader.ts"; const got = mbReaderBinary(); const want = resolve(process.env.STILLFAIL_MB_READER); if (got !== want) { console.error("mbReaderBinary mismatch:", { got, want }); process.exit(1); }'

          STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_READER_CANDIDATE="$BIN_PION" STILLFAIL_REQUIRE_DUAL_READER=1 \
            node --test station/test/reader-contract-builders.test.ts

          STILLFAIL_MB_READER="$BIN_PION" node --test \
            station/test/mb-archive-marks.test.ts \
            station/test/mb-session-bindings.test.ts \
            station/test/mb-session-counts.test.ts \
            station/test/mb-signin-save.test.ts \
            station/test/mb-post-blocks.test.ts \
            station/test/mb-usage-retire.test.ts \
            station/test/mb-widget-sources.test.ts \
            station/test/mb-card-posts.test.ts \
            station/test/mb-lookups.test.ts \
            station/test/mb-session-up-jobs.test.ts \
            station/test/mb-outflow-chats.test.ts \
            station/test/mb-search-scope.test.ts \
            station/test/mb-session-list.test.ts \
            station/test/mb-archive-last.test.ts \
            station/test/mb-page-letters.test.ts \
            station/test/autoarchive-last-bounded.test.ts

          STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" node --test \
            station/test/builders-core-pion-switch.test.ts \
            station/test/builders-index-pion-switch.test.ts \
            station/test/builders-stateful-pion-switch.test.ts

  gate-sqlite-w5:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build-linux
    if: needs.build-linux.result == 'success'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Download and verify Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/download-artifact.sh "$GITHUB_RUN_ID" pion-station-linux-bins "$RUNNER_TEMP/bins"
          (cd "$RUNNER_TEMP/bins" && sha256sum -c SHA256SUMS)
          chmod +x "$RUNNER_TEMP/bins/stillfail-pion-linux-x64" "$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          test "$(realpath "$RUNNER_TEMP/bins/stillfail-pion-linux-x64")" != "$(realpath "$RUNNER_TEMP/bins/stillfail-reader-linux-x64")"

      - name: Run Wave 5 foundation gates and MB Permit regression suite
        run: |
          set -euo pipefail
          BIN_PION="$RUNNER_TEMP/bins/stillfail-pion-linux-x64"
          BIN_MB="$RUNNER_TEMP/bins/stillfail-reader-linux-x64"
          pnpm --dir station install --frozen-lockfile --prefer-offline

          STILLFAIL_MB_READER="$BIN_MB" STILLFAIL_PION_READER="$BIN_PION" \
            node --test station/test/w5-foundation.test.ts

          STILLFAIL_MB_READER="$BIN_MB" node --test \
            station/test/mb-turn-counts.test.ts \
            station/test/mb-said.test.ts

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [c-shims, pion-unit, build-linux, gate-workers, gate-sqlite-w14, gate-sqlite-w5]
    if: always()
    steps:
      - name: Require all upstream jobs to succeed
        env:
          R_CSHIMS: ${{ needs.c-shims.result }}
          R_UNIT: ${{ needs.pion-unit.result }}
          R_BUILD: ${{ needs.build-linux.result }}
          R_WORKERS: ${{ needs.gate-workers.result }}
          R_W14: ${{ needs.gate-sqlite-w14.result }}
          R_W5: ${{ needs.gate-sqlite-w5.result }}
        run: |
          set -euo pipefail
          echo "c-shims=$R_CSHIMS pion-unit=$R_UNIT build-linux=$R_BUILD gate-workers=$R_WORKERS gate-sqlite-w14=$R_W14 gate-sqlite-w5=$R_W5"
          for r in "$R_CSHIMS" "$R_UNIT" "$R_BUILD" "$R_WORKERS" "$R_W14" "$R_W5"; do
            if [ "$r" != "success" ]; then
              echo "FAIL: upstream job result is '$r' (expected 'success')" >&2
              exit 1
            fi
          done

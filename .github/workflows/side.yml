# The side run (scripts/side.sh, docs/development.md "Tests"): the tests that are not the same every run (real time,
# real processes and sockets, networks made up at random), on main every four hours and on demand, blocking nothing.
# Cross-platform parts run one at a time on ci-1's dedicated linux-quick runner (falling back to macos-ci when
# vars.CI_1 == 'off'), leaving only the station's simulator-backed side tests on macos-ci (`side-mac`), not on a
# machine people and agents share (on the Mac test station, another agent load-testing it made the real relays' round
# trips slow enough to fail, 2026-10-08). A failure is for an agent to reproduce as a test CI runs and fix; one it
# cannot reproduce is let be.
name: side
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
concurrency:
  group: side
  cancel-in-progress: false
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }} # read-only API fallback if the public release download fails
jobs:
  side:
    strategy:
      fail-fast: false
      # One at a time: the mesh's tests compare real round trips, and locks/rigs start local clouds, relays and stations.
      max-parallel: 1
      matrix:
        part: [core-ts, rust, locks, locks-moved, locks-as-moved, rigs, rigs-as-moved, cloud]
    runs-on: ${{ fromJSON(vars.CI_1 != 'off' && '["self-hosted", "linux-quick"]' || '["self-hosted", "macos-ci"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/natives
      - if: matrix.part == 'core-ts'
        run: pnpm install --frozen-lockfile && cd client/core-ts && pnpm install --frozen-lockfile
      - if: matrix.part == 'cloud'
        run: cd cloud && pnpm install --frozen-lockfile
      - name: side (${{ matrix.part }})
        run: sh scripts/side.sh ${{ matrix.part }}
      # (what a failed locks or rigs kept before its down, scripts/e2e-local.sh `kept`: the cloud's, the relay's and each
      # station's logs apart, each device's record of its links, the stations' locks; run 42815367472's device E was
      # refused a handshake five times, and its log could not say by which process or what E had dialled)
      - if: failure() && (matrix.part == 'locks' || matrix.part == 'locks-moved' || matrix.part == 'locks-as-moved' || matrix.part == 'rigs' || matrix.part == 'rigs-as-moved')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with: { name: "side-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/side-${{ matrix.part }}/kept", retention-days: 3, if-no-files-found: ignore }

  # The station's side tests, which boot iOS Simulators on macos-ci.
  side-mac:
    runs-on: [self-hosted, macos-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      # The simulator tests' devices, made and set booting while the rest installs and runs (MoonBit, the natives and the
      # packages too, not before it: side-mac took 357 s): each test's own cold boot, five in a row, took this job past
      # its 10 minutes (134713681856). The iPhone is shared by four of them in turn (SIM_SHARED_UDID), the Duo used by
      # its own (SIM_DUO_UDID); "simulators left" below deletes both.
      - name: simulators made
        run: |
          S=/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/bin/simctl
          $S list -j runtimes > "$RUNNER_TEMP/runtimes.json"
          picked() { node -e '
            const rs = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).runtimes.filter((r) => r.isAvailable && r.platform === "iOS");
            const r = process.argv[2] === "duo" ? rs.filter((r) => r.supportedDeviceTypes?.some((t) => t.identifier.endsWith(".iPhone-Duo"))).at(-1) : rs.at(-1);
            const t = r && (process.argv[2] === "duo" ? { identifier: "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo" } : r.supportedDeviceTypes.find((t) => t.productFamily === "iPhone"));
            if (t) console.log(t.identifier + " " + r.identifier);' "$RUNNER_TEMP/runtimes.json" "$1"; }
          set -- $(picked iphone)
          if [ $# -eq 2 ]; then u=$($S create "still.fail side shared" "$1" "$2"); echo "SIM_SHARED_UDID=$u" >> "$GITHUB_ENV"; ($S boot "$u" >/dev/null 2>&1 &); fi
          set -- $(picked duo)
          if [ $# -eq 2 ]; then u=$($S create "still.fail side duo" "$1" "$2"); echo "SIM_DUO_UDID=$u" >> "$GITHUB_ENV"; ($S boot "$u" >/dev/null 2>&1 &); fi
      - uses: ./.github/actions/mbui-moonbit
      - uses: ./.github/actions/natives
      - run: pnpm install --frozen-lockfile && cd station && pnpm install --frozen-lockfile
      # (the simulators' pictures as the tests took them, kept when one fails: a tap on the Duo's inner panel that opened
      # nothing for a minute could not be told from its log alone, 41636490524)
      - name: side (station)
        env:
          SIM_OUT: ${{ runner.temp }}/sim
        run: sh scripts/side.sh station
      # A job stopped at its timeout leaves its simulators booted, each slowing the next run and holding this Mac's little disk.
      - if: always()
        name: simulators left
        run: |
          S=/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/bin/simctl
          for u in $($S list devices | grep "still.fail side" | grep -oE "[0-9A-F-]{36}"); do $S shutdown "$u" 2>/dev/null; $S delete "$u"; done
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with: { name: "side-sim-${{ github.run_id }}-${{ github.run_attempt }}", path: "${{ runner.temp }}/sim", retention-days: 3, if-no-files-found: ignore }
  # The station's X11 screens on a real X server (Xvfb, ffmpeg's x11grab, xdotool): a display that would not open
  # failed main's check once (Cannot open display :99, 41459527166), so here, not on every push.
  x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      # (the .debs kept in the cache: fetched bare from Ubuntu's mirror they took the job past its 5 minutes, 44303560210)
      - uses: ./.github/actions/apt
        with:
          name: side-x11
          packages: ffmpeg xdotool xvfb xauth x11-utils x11-xkb-utils x11-xserver-utils python3-gi gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libxtst6
      - name: Linux X11 capture and input
        run: |
          pnpm --dir station install --frozen-lockfile
          export STILLFAIL_TEST_X11=1 STILLFAIL_TEST_X11_REAL_MESH=1 XDG_SESSION_TYPE=x11
          unset WAYLAND_DISPLAY
          cd station
          for test in test/x11-desktop.test.ts test/x11-desktop-real.test.ts test/x11-h264.test.ts test/x11-desktop-lifecycle.test.ts; do
            node ../scripts/native.ts run mesh -- xvfb-run -a -s '-screen 0 1280x800x24' node --import ./test/setup-env.mjs --test "$test"
          done
          /usr/bin/python3 test/linux-portal-text.py
          /usr/bin/python3 test/linux-portal-frames.py
          /usr/bin/python3 test/linux-gamepad.py
          xvfb-run -a -s '-screen 0 800x600x24' /usr/bin/python3 test/linux-x11-gstreamer.py
          STILLFAIL_TEST_X11_APT=1 xvfb-run -a -s '-screen 0 1280x800x24' node --import ./test/setup-env.mjs --test --test-name-pattern='private APT pair' test/linux-screen-tools.test.ts

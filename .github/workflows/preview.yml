# still.fail preview (apps/mbui's `preview` variant: fail.still.mbui, "still.fail preview", an app of its own beside
# the released and beta ones): on main, each push that changes what it is built from is out in a few minutes, on
# GitHub's own runners, without waiting for the pipeline's checks: its Windows app's installer, signed
# (/releases/latest/win-mbui), its Linux app tarred with its installer for x64 and arm64 (/releases/latest/linux-mbui,
# linux-arm64-mbui; Linux has no other channel), and its iOS app built unsigned for a device and kept as an Actions
# artifact (TestFlight is the separate manual mbui-testflight.yml workflow). The Windows app also runs end to end here
# once a day, and main's Windows build is kept for the beta's and stable's installers (pipeline.yml desktop-win,
# stable.yml) to reuse. Its Android and Mac preview builds were taken out on 2026-11-03 (the beta, pipeline.yml, is
# the test channel there; their feeds android/mbui and mac/mbui stay as they were). The feeds and the app's id keep
# the name mbui: installed preview apps update by them.
# A workflow of its own, not a job of pipeline.yml: nothing of the pipeline waits for it or fails with it. As asked
# (2026-10-19), its tests do not hold it back: it is a test app (Windows' e2e runs after its installer is out). A feed moves
# only once its file is fetched back from where it is served, the same bytes.
# What stays between runs, by content, in the Actions cache: MoonBit (by its release's ETags), mbc's compiled units
# (MBC_STORE), core.hbc by its inputs (HBC_CACHE), React Native's Hermes for Apple and its hermesc (by the versions
# core.sh pins). The core's shell is still.fail's natives (scripts/native.ts shell, shell-apple; Windows' engine too),
# fetched by its key, never built here; Apple's engine, one file compiled in 1-2 s, is made in each run.
name: preview
on:
  push:
    branches: ["**"]
    paths:
      - "apps/mbui/**"
      - "libs/ui/**"
      - "client/**"
      - "rules/js/**"
      - "web/public/avatars/index.json"
      - "shared/moved-from.ts"
      - "shared/station-busy.ts"
      - "shared/release-keys.ts"
      - "shared/release-signed.ts"
      - "shared/delta.ts"
      # (not the four config files apps/mbui/scripts/core.sh HBC_TREES ends with, on purpose: it says why)
      - "vendor/**"
      - "scripts/native.ts"
      - "scripts/release-put.sh"
      - "scripts/release-sign.ts"
      - "scripts/release-deltas.ts"
      - "scripts/delta.ts"
      - "scripts/win-feeds.sh"
      - "scripts/release.sh"
      - "station/src/updates/**"
      - "cloud/src/install.ts"
      - "cloud/test/dev.ts"
      - ".github/workflows/preview.yml"
      - ".github/actions/setup/**"
      - ".github/actions/msvc/**"
      - ".github/actions/apt/**"
  # (the Windows app run end to end, once a day: below, the windows job's E2E)
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
# main: one at a time, a push meanwhile waits as one run of the newest; a branch: only its newest push matters.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # Which packages main's push makes: those whose app changed since the build their feed names (beta.sh changed: its
  # code, not its tests, docs, scripts or CI; a push of those alone is no new package, 2026-10-21). iOS has no
  # feed: every matching main push builds a downloadable unsigned artifact, once its shell is prebuilt (ios-shell). A
  # run by hand builds them all;
  # a branch's push only Windows and Linux: its iOS build puts nothing and took one of the organization's 5 macOS
  # jobs for each push (2026-10-21).
  what:
    if: github.repository_owner == 'AFK-surf' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      win: ${{ steps.what.outputs.win }}
      linux: ${{ steps.what.outputs.linux }}
      ios: ${{ steps.what.outputs.ios }}
      handoff: ${{ steps.what.outputs.handoff }}
      win_build: ${{ steps.what.outputs.win_build }}
    steps:
      # (the history's commits and trees, the files' contents only for beta.sh: what changed is told by the trees)
      # (a SYN lost to github.com waits 135 s on Linux's 6 retries, most of a job's 5 minutes; 3 retries give up in 15 s and connect again: 44991143294)
      - run: |
          git config --global http.lowSpeedLimit 1024 && git config --global http.lowSpeedTime 20
          sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, filter: "blob:none", sparse-checkout: apps/mbui/scripts }
      - id: what
        run: |
          branch=; [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_EVENT_NAME" != push ] || branch=1
          for p in win linux ios; do
            # (the day's run: the Windows app alone, built and run end to end, nothing put)
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then v=no; [ $p = win ] && v=yes; echo "$p=$v" >> "$GITHUB_OUTPUT"; echo "$p: $v"; continue; fi
            # iOS has no feed: build every matching main push.
            if [ "$p" != ios ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then v=$(bash apps/mbui/scripts/beta.sh changed "$p"); else v=yes; fi
            # (Linux's two machines each have a feed: a package for both when either's is behind, as arm64's before its first)
            if [ "$p" = linux ] && [ "$v" = no ]; then v=$(bash apps/mbui/scripts/beta.sh changed linux-arm64); fi
            case "$branch$p" in 1ios) v=no ;; esac
            echo "$p=$v" >> "$GITHUB_OUTPUT"
            echo "$p: $v"
          done
          # The desktop app (Electron's) moved over to the Windows app by its own updater (the windows job's last step,
          # e2e/win/handoff.sh): asked for by hand, or for a change to what that goes by (the installer, the app's
          # identity and its data's place, how it is built as the desktop app, the release's feeds), since main (a
          # branch) or the push before (main).
          v=no
          if [ "$GITHUB_EVENT_NAME" != push ]; then v=yes
          else
            base=${{ github.event.before }}
            [ -n "$branch" ] && base=$(git merge-base origin/main HEAD)
            if git cat-file -e "$base^{commit}" 2>/dev/null && git diff --name-only "$base" HEAD |
              grep -qE '^(apps/mbui/windows/|apps/mbui/e2e/win/handoff\.sh$|apps/mbui/scripts/win\.sh$|apps/mbui/src/host/win_core\.c$|apps/mbui/src/host/win_(electron_sealed|hello)\.h$|libs/ui/src/host/win_(life|update)\.h$|scripts/(win-feeds|release)\.sh$|scripts/release-sign\.ts$|shared/(release-keys|release-signed|delta)\.ts$|station/src/updates/)'; then v=yes; fi
          fi
          echo "handoff=$v" >> "$GITHUB_OUTPUT"
          echo "handoff: $v"
          # How the Windows app is built (its compiler, mbc, the release variants' build), since main (a branch): what
          # the windows job's check that the beta app reuses the app's objects goes by. On every push it was 14-25 s of
          # a job at 180-200 s, for a change it could not catch (no-dup-tooltips 41277416265, 2026-11-01).
          v=no
          if [ "$GITHUB_EVENT_NAME" != push ] || [ -z "$branch" ]; then v=yes
          else
            base=$(git merge-base origin/main HEAD)
            if git cat-file -e "$base^{commit}" 2>/dev/null && git diff --name-only "$base" HEAD |
              grep -qE '^(apps/mbui/scripts/(win|win-compiler|beta|env)\.sh$|libs/ui/scripts/(win\.sh|mbc|env\.sh)$|libs/ui/tools/mbc/|\.github/workflows/(preview|pipeline|stable)\.yml$|\.github/actions/(msvc|mbui-moonbit)/|scripts/release\.sh$)'; then v=yes; fi
          fi
          echo "win_build=$v" >> "$GITHUB_OUTPUT"
          echo "win_build: $v"

  # The Linux app (apps/mbui/scripts/linux.sh: GTK 4, the engine and shell prebuilt for the machine, core.hbc), for x64
  # and arm64, each on GitHub's Ubuntu of that machine (a public repository's: free): built on every push that changes
  # it; on main tarred with its installer and put, each on its machine's feed (beta.sh linux: the part linux, linux-arm64).
  linux:
    needs: what
    if: github.repository_owner == 'AFK-surf' && needs.what.outputs.linux == 'yes'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-24.04, part: linux }
          - { arch: arm64, os: ubuntu-24.04-arm, part: linux-arm64 }
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    # (a run by hand, or the day's, compiles what main's store has none of whole: once the units' commands named mbui at
    # libs/ui, 2026-11-13, none of the store's were theirs, and a push's 5 minutes did not see it through)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    env:
      # (scripts/native.ts: GitHub's release API, asked when the release's download fails, with the job's token, not
      # the runners' shared address's anonymous quota: 403 there, main eb3f3a3a's ios, 43992166607)
      GH_TOKEN: ${{ github.token }}
      MBUI_FRESH: 1
      MBUI_CACHE: ${{ github.workspace }}/.ci/release
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
    steps:
      # (when the job is cut, its timeout-minutes above, for its build's own limit to the second (scripts/with-timeout.sh))
      # (less the 1-5 s of "Set up job" before it, as windows')
      # (a branch's app: mbc's MBC_LIGHT_TESTS, each unit taken at -O2 where main's store has it as this program's would
      # be, what it has not compiled at -O0, as pipeline.yml's desktop-build: all at -O2 a push after main took a large
      # change and before it saved a store of it was cut. Main's stays -O2)
      - name: The job's end
        run: |
          echo "JOB_END=$(( $(date +%s) + ${{ github.event_name == 'push' && 5 || 10 }} * 60 - 5 ))" >> "$GITHUB_ENV"
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 20
          [ "$GITHUB_REF" = refs/heads/main ] || echo "MBC_LIGHT_TESTS=stillfail/stillfail" >> "$GITHUB_ENV"
          # (a SYN lost to github.com waits 135 s on Linux's 6 retries, most of a job's 5 minutes; 3 retries give up in 15 s and connect again: 44991143294)
          sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
      # (GTK 4 and what the host and the core link beside it: libsoup, libsecret)
      - uses: ./.github/actions/apt
        with:
          name: mbui-linux-${{ matrix.arch }}
          packages: libgtk-4-dev libepoxy-dev libsoup-3.0-dev libsecret-1-dev clang
      # (the runner's compiler and headers (IMG: cc and 12 hex digits of clang, its --version, the C standard headers
      # as it preprocesses them and the GTK -dev packages' versions; none, a runner of our own: own), for the units' store: other compilers or headers make other units,
      # so one store over two kept only the last run's units (used.sh), the other's run compiling all again (preview's
      # ios on main, 20261104.0337.1 and 20261112.0361.1 in turn, 43919855625 to 43925936518, 2026-11-16). Not the
      # image's ImageVersion, as mbui-check.yml says: images of one clang and libc tore main's store apart)
      - name: The runner's compiler
        run: |
          if [ -z "${ImageVersion:-}" ]; then
            img=own
          else
            cc_bin=$(command -v clang || true)
            img="cc$({
              [ -n "$cc_bin" ] && sha256sum "$cc_bin" && "$cc_bin" --version &&
                printf '#include <stdio.h>\n#include <stdlib.h>\n#include <stdint.h>\n#include <string.h>\n#include <math.h>\n#include <limits.h>\n' | "$cc_bin" -E -x c - 2>/dev/null || true
              dpkg-query -W -f='${Package}=${Version}\n' libgtk-4-dev libepoxy-dev libsoup-3.0-dev libsecret-1-dev 2>/dev/null || true
            } | sha256sum | cut -c1-12)"
          fi
          echo "IMG=$img" >> "$GITHUB_ENV"
          echo "IMG=$img (image=${ImageVersion:-own}, cc=$(${cc_bin:-clang} --version 2>/dev/null | head -1))"
      # (Node alone here: pnpm and its store only for a core.hbc not kept, below)
      - uses: ./.github/actions/node
      # (mbc and chk alone, as pipeline.yml's desktop-build: the other tools' keys and caches were a step's 12 s)
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc chk' }
      # (the Linux engine, shell and libghostty-vt, which apps/mbui/scripts/linux.sh links, in the native cache, as a run
      # before fetched them, as the windows job keeps its own: one download from the store took 84 s for 2.9 MB, main
      # 9440b484, 40668393099)
      - name: The Linux natives' keys
        id: native-keys
        run: echo "key=natives-linux-${{ matrix.arch }}-$(node scripts/native.ts key shell linux-${{ matrix.arch }})-$(node scripts/native.ts key engine linux-${{ matrix.arch }})-$(node scripts/native.ts key ghostty-vt linux-${{ matrix.arch }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: Tools (the Linux engine, shell and libghostty-vt prebuilt)
        run: |
          sh apps/mbui/scripts/mbui.sh > /dev/null
          node scripts/native.ts fetch engine linux-${{ matrix.arch }}
          node scripts/native.ts fetch shell linux-${{ matrix.arch }}
          node scripts/native.ts fetch ghostty-vt linux-${{ matrix.arch }}
      # (moon's own build of mbui's and the app's copies, libs/ui/scripts/linux.sh's out/linux/mod and out/linux/app:
      # mirrored by content there so that moon, going by mtimes, builds again only what changed, but made from nothing
      # on every runner, ~75 s of moonc before mbc's units were asked: 578a45fe4's linux (x64) cut at its reserve. main's
      # newest, saved below; mbc's units are the store's below, left out here)
      - uses: actions/cache/restore@v4
        id: moon
        with:
          path: |
            libs/ui/out/linux/mod
            libs/ui/out/linux/app
            !libs/ui/out/linux/**/*.mbc
            !libs/ui/out/linux/**/*.mbc/**
          # (of no image, as the ios job's: moonc and its C the same on each)
          key: mbui-linux-moon-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: mbui-linux-moon-${{ matrix.arch }}-
      # (each file of the app, mbui and the library given its content's mtime, so moon builds over the
      # build restored only what changed: without it every checkout's new mtimes had moon build sf-ui's
      # packages and all over them again, 75-90 s of moonc, Linux cut at its 5 minutes, 44365395131, 2026-11-18)
      - run: bash apps/mbui/scripts/moon-mtimes.sh
      # The app built in the background from here on (MBUI_LINUX_CORE=0: the core's bytecode is the steps' below, put
      # beside it once built), as mbui-check.yml's app build and the windows job's: moonc's 50-80 s needs nothing of
      # git's history, the units' store, core.hbc or pnpm, which were 68 s before it one after another, the build left
      # 186 s and cut 6 s short of its 995 units (preview 44464002952, 2026-11-19). mbc waits for the units' store
      # (MBC_STORE_WAIT) until the steps below have restored it and handed it over whole.
      # (a build cut short by its own limit, before the job's, still keeps what it compiled: the store saved over what was
      # restored, nothing taken out, so the next run goes on from there. Saved only at the job's end, a store too far
      # behind to be caught up in five minutes was never saved again: Linux x64's on main, cut at its limit on nearly
      # every run from 11:50 UTC on 2026-11-15, after #6483 made every unit new, 746 of 992 units compiled where it got
      # through, its beta not put all that while)
      # (cut before the job is: a branch's 35 s, what follows a build done there (the put, the keys and the save ~6 s,
      # beta.sh linux ~16 s, its upload ~2 s, post steps ~4 s), the stop, the key and the save after a cut some 30 s;
      # main's 42 s, beta.sh publish after those, its deltas given only what leaves the moon build's save its room)
      - name: Build (APP=stillfail), started
        id: start
        run: |
          B=$RUNNER_TEMP/build
          rm -rf "$B" "$RUNNER_TEMP/ci-live" "$RUNNER_TEMP/linux-store-pending.failed"
          mkdir -p "$B" "$RUNNER_TEMP/ci-live"
          : > "$RUNNER_TEMP/linux-store-pending"
          touch "$RUNNER_TEMP/start"
          # (every process of the build's carries this mark, for the step after to stop what is left of it when it was
          # cut: a step stopped leaves its children running, and they wrote the store as the cache's tar read it)
          echo "$$-$(date +%s%N)" > "$RUNNER_TEMP/build-tree"
          export MBUI_BUILD_TREE=$(cat "$RUNNER_TEMP/build-tree")
          export MBUI_LINUX_CORE=0 MBC_STORE="$RUNNER_TEMP/ci-live/mbc-store" MBC_STORE_WAIT="$RUNNER_TEMP/linux-store-pending"
          reserve=$([ "$GITHUB_REF" = refs/heads/main ] && echo 42 || echo 35)
          nohup bash -c 'set +e; bash scripts/with-timeout.sh "@$1" bash apps/mbui/scripts/linux.sh build > "$0/log" 2>&1; code=$?; printf "%s\n" "$code" > "$0/status.tmp"; mv "$0/status.tmp" "$0/status"; exit "$code"' "$B" "$((JOB_END - reserve))" > "$B/worker.log" 2>&1 < /dev/null &
          echo "$!" > "$B/pid"
      - run: bash scripts/git-history.sh
      # mbc's units: main's newest, and on a branch its own last push's over them (m- and b-, as check-mbui keeps its
      # own). With main's alone, every push of a branch compiled all it had changed since main again: presets' two
      # pushes 273 and 276 of 480 units, 78 s of each Linux x64 build (41288956328, 41289661355, 2026-11-01; a branch
      # restores its own after main's, then main's newest units over it).
      # (.ci/hbc in the paths for the caches' version alone, which is of the paths: the caches saved before kept
      # core.hbc's 51 MB beside the units, and are still taken. Saved now without it (the save below), it is kept in
      # its own cache alone: hbc below)
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-linux-${{ matrix.arch }}-m-${{ env.IMG }}-${{ github.sha }}
          # (m- alone: GitHub tries every restore key on the branch's own caches before main's, so a wider name took the
          # branch's last push for main's newest, a push after main's moved compiling it all again. This image's first,
          # else another's)
          restore-keys: |
            mbui-linux-${{ matrix.arch }}-m-${{ env.IMG }}-
            mbui-linux-${{ matrix.arch }}-m-
      - if: github.ref != 'refs/heads/main'
        run: mkdir -p .ci/mbc-store && mv .ci/mbc-store "$RUNNER_TEMP/store-main"
      - uses: actions/cache/restore@v4
        id: own
        if: github.ref != 'refs/heads/main'
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-linux-${{ matrix.arch }}-b-${{ env.IMG }}-${{ github.sha }}
          restore-keys: |
            mbui-linux-${{ matrix.arch }}-b-${{ env.IMG }}-
            mbui-linux-${{ matrix.arch }}-b-
      # (handed over whole, as mbui-check.yml's: the store moved where the build reads it (MBC_STORE) and its wait taken
      # away; main's units linked in beside a branch's, not copied: a unit's files are never written again once kept)
      - name: The units, handed to the build
        if: always() && steps.start.outcome == 'success'
        run: |
          mkdir -p .ci/mbc-store
          if [ -d "$RUNNER_TEMP/store-main" ]; then
            cp -a -l -n "$RUNNER_TEMP/store-main/." .ci/mbc-store/ && rm -rf "$RUNNER_TEMP/store-main"
          fi
          echo "units: $(find .ci/mbc-store -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)"
          L=$RUNNER_TEMP/ci-live/mbc-store
          if [ -d "$L" ]; then cp -a -l -n .ci/mbc-store/. "$L/" && rm -rf .ci/mbc-store; else mv .ci/mbc-store "$L"; fi
          rm -f "$RUNNER_TEMP/linux-store-pending"
      # core.hbc by its inputs (HBC_CACHE) in a cache of its own, as the windows job's, not of the image's: GitHub giving
      # the runs two images in turn, the store of the other image held no core.hbc made with the same hermesc, and pnpm and
      # Hermes ran again, ~25 s (x64 44367062557, arm64 44369994771, 2026-11-18). The names in it are their contents' keys.
      - uses: actions/cache/restore@v4
        id: hbc
        with:
          path: .ci/hbc
          key: mbui-linux-hbc-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: mbui-linux-hbc-${{ matrix.arch }}-
      # (the core's packages only for a core.hbc not kept for this commit's inputs, as the ios job's: asked with the
      # hermesc linux.sh's core step makes it with)
      - id: core
        run: if HERMESC="$(node scripts/native.ts path engine linux-${{ matrix.arch }})/hermesc" bash apps/mbui/scripts/core.sh hermes-kept; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.core.outputs.kept != 'true'
        uses: ./.github/actions/setup
      - name: The core's packages
        if: steps.core.outputs.kept != 'true'
        run: (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
      - name: The core's bytecode (Hermes)
        run: bash apps/mbui/scripts/linux.sh core
      # (the build's own exit status, 124 where it was cut; done, the core's bytecode put beside it)
      - name: Build (APP=stillfail)
        id: build
        run: |
          B=$RUNNER_TEMP/build
          while [ ! -s "$B/status" ]; do
            if [ "$(date +%s)" -ge "$((JOB_END - 20))" ]; then
              echo "::error::the build did not say how it ended before the job's end"
              tail -80 "$B/log" "$B/worker.log" 2>/dev/null || true
              exit 124
            fi
            if ! kill -0 "$(cat "$B/pid")" 2>/dev/null; then
              [ ! -s "$B/status" ] || break
              cat "$B/worker.log" "$B/log" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          cat "$B/log"
          code=$(cat "$B/status")
          [ "$code" = 0 ] || exit "$code"
          bash apps/mbui/scripts/linux.sh put
      # (what a cut build left running stopped on main and a branch alike; a branch's store saved only of a build that
      # went through: a job that needs longer is made faster, never finished over several pushes, .github/AGENTS.md;
      # main's cut keeps what it compiled)
      - name: The caches' keys, by what they hold
        if: always() && steps.start.outcome == 'success'
        run: |
          ok=${{ steps.build.outcome == 'success' && '1' || '' }}
          if [ -z "$ok" ]; then
            # (a build still waiting for the store told it is not coming)
            [ ! -f "$RUNNER_TEMP/linux-store-pending" ] || touch "$RUNNER_TEMP/linux-store-pending.failed"
            # (what the build left running (moon, mbc, clang) stopped first, so the store is still as it is tarred:
            # mbui-check.yml's native job's save failed so, 43839505847)
            t=$(cat "$RUNNER_TEMP/build-tree" 2>/dev/null || true)
            for i in 1 2 3 4 5; do
              p=$( [ -z "$t" ] || grep -lsz "^MBUI_BUILD_TREE=$t\$" /proc/[0-9]*/environ 2>/dev/null | cut -d/ -f3 || true)
              [ -n "$p" ] || p=$(pgrep -x 'moon|moonc|mbc|clang|clang\+\+|clang-[0-9]+' || true)
              [ -n "$p" ] || break
              echo "stopping $(echo $p | wc -w) left running: $(for x in $p; do cat /proc/$x/comm 2>/dev/null; done | sort | uniq -c | tr -s ' \n' ' ')"
              kill -KILL $p 2>/dev/null || true
              sleep 1
            done
          fi
          # (the store back where the caches keep it: their version is of the paths)
          L=$RUNNER_TEMP/ci-live/mbc-store
          if [ -d "$L" ]; then
            mkdir -p .ci/mbc-store && cp -a -l -n "$L/." .ci/mbc-store/ && rm -rf "$L"
          fi
          if [ -n "$ok" ]; then
            sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          else
            find .ci/mbc-store -name '*.lock' -delete 2>/dev/null || true
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "a branch's build that did not go through: its store not saved"; exit 0; }
            # (a cut run's store keeps what no run used for four hours no longer, as mbui-check.yml's: saved whole, a cut
            # store grew run after run, its save 29 s, 44370994879)
            [ ! -d .ci/mbc-store ] || find .ci/mbc-store -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/start" -mmin +240 -exec rm -rf {} +
          fi
          echo "STORE_KEY=mbui-linux-${{ matrix.arch }}-${{ github.ref == 'refs/heads/main' && 'm' || 'b' }}-$IMG-$(sh apps/mbui/scripts/held.sh .ci/mbc-store)" >> "$GITHUB_ENV"
          # (core.hbc out of the store's save, kept in its own cache: put back after it, below)
          [ ! -d .ci/hbc ] || mv .ci/hbc "$RUNNER_TEMP/hbc-held"
      - if: always() && env.STORE_KEY != '' && env.STORE_KEY != steps.store.outputs.cache-matched-key && env.STORE_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: ${{ env.STORE_KEY }}
      # (main's core.hbc kept on its own, read by every image's runs: hbc above)
      - name: The core's bytecode's key
        if: always() && steps.start.outcome == 'success'
        run: |
          [ ! -d "$RUNNER_TEMP/hbc-held" ] || { rm -rf .ci/hbc && mv "$RUNNER_TEMP/hbc-held" .ci/hbc; }
          [ "$GITHUB_REF" = refs/heads/main ] || exit 0
          [ -z "$(ls -A .ci/hbc 2>/dev/null)" ] || echo "HBC_KEY=mbui-linux-hbc-${{ matrix.arch }}-$(sh apps/mbui/scripts/held.sh .ci/hbc)" >> "$GITHUB_ENV"
      - if: always() && !cancelled() && github.ref == 'refs/heads/main' && env.HBC_KEY != '' && env.HBC_KEY != steps.hbc.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/hbc
          key: ${{ env.HBC_KEY }}
      - name: Tarred with its installer
        run: bash apps/mbui/scripts/beta.sh linux
      # (its deltas given 25 s at most, and what leaves 45 s of the job after them: the put and its checks ~12 s, then
      # moon's build saved. With beta.sh's own 35 s, the deltas and the put took all but 11 s and moon's build was not
      # saved on any run that made deltas, preview 44465102170, 2026-11-19)
      - name: Put it, check it, then its feed
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          dl=$(( JOB_END - $(date +%s) - 45 ))
          [ "$dl" -le 25 ] || dl=25
          STILLFAIL_DELTAS_SECONDS=$dl bash apps/mbui/scripts/beta.sh publish ${{ matrix.part }}
      # (moon's build saved last, after the package is put and only where the job has the time left for it: a save cut
      # by the job's limit would cancel a job whose beta was out, and a save that fails fails nothing (its 177 MB took
      # 4 s). Kept once moonc has made the app's C (stillfail.c), a cut build's too: kept only of a build that went
      # through, main's cut in its -O2 C kept none and every run did moonc's ~75 s again, cut again (2026-11-18,
      # 44310664729, 44312202811). Keyed by that C, as pipeline.yml's "Moon's build, once moonc made the app's C": one
      # the same is not saved again; mbc's units are not moon's.)
      - id: moon-room
        if: always() && github.ref == 'refs/heads/main' && steps.start.outcome == 'success'
        run: |
          c=libs/ui/out/linux/app/_build/native/release/build/stillfail/stillfail/stillfail.c
          left=$(( JOB_END - $(date +%s) ))
          if [ -s "$c" ] && [ "$left" -gt 14 ]; then
            find libs/ui/out/linux -type d -name '*.mbc' -prune -exec rm -rf {} +
            echo "key=mbui-linux-moon-${{ matrix.arch }}-$(sha256sum "$c" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          else
            echo "moon's build not saved: stillfail.c=${c} (${left} s left)"
          fi
      - if: always() && steps.moon-room.outputs.key != '' && steps.moon-room.outputs.key != steps.moon.outputs.cache-matched-key
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            libs/ui/out/linux/mod
            libs/ui/out/linux/app
            !libs/ui/out/linux/**/*.mbc
            !libs/ui/out/linux/**/*.mbc/**
          key: ${{ steps.moon-room.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with: { name: "mbui-linux-${{ matrix.arch }}-${{ github.sha }}", path: ".ci/release/release/${{ matrix.part }}", retention-days: 7 }

  # Whether the iOS app's shell (shell-apple ios-arm64) is prebuilt for this push. main's pipeline publishes it (its
  # natives job, from macos-ci's cache), behind the runs before it, and this workflow waits for no pipeline: the push
  # that changed the shell, and each after it until that is out, came to the ios job first, which then builds the shell
  # with cargo, ~4.5 min of its 5: cancelled at its limit each time, nothing made and nothing kept for the next (six
  # of main's pushes on 2026-11-12, each after a change to client/shell: b57eff00's after #5802's). Such a push makes
  # no iOS app: the ios job is skipped, and the next push that finds the shell builds one. A run by hand builds with
  # the shell as it finds it, built there when not prebuilt, as before. (Beside what, not after it: what's ios is yes
  # for every push to main and every run by hand, beta.sh never asked for it, and waiting for it was ~20 s of the ios
  # job's start, 44411432671.)
  ios-shell:
    if: github.repository_owner == 'AFK-surf' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      have: ${{ steps.have.outputs.have }}
    steps:
      # (a SYN lost to github.com waits 135 s on Linux's 6 retries, most of a job's 5 minutes; 3 retries give up in 15 s and connect again: 44991143294)
      - if: github.event_name == 'push'
        run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - if: github.event_name == 'push'
        uses: actions/checkout@v5
      - if: github.event_name == 'push'
        uses: ./.github/actions/node
      - id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=yes
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            missing=$(node scripts/native.ts missing shell-apple:ios-arm64)
            if [ -n "$missing" ]; then
              have=no
              echo "::notice::No iOS app for this push: its shell ($missing, key $(node scripts/native.ts key shell-apple ios-arm64)) is not published yet (main's pipeline, the natives job). The next push that finds it builds one."
            fi
          fi
          echo "have=$have" >> "$GITHUB_OUTPUT"
          echo "have: $have"

  # Built with iOS 27.1's SDK: an app built with an older one runs on an iPhone Duo's inner screen letterboxed, black
  # bars either side, and is told nothing of its hinge (UIHingeInteraction, its fold's reserved regions: ios_app.m).
  # GitHub's xcode-27 image has Xcode 27.1 beside its default 27.0 (2026-10-23); the SDK is checked, not trusted.
  ios:
    needs: [what, ios-shell]
    if: github.repository_owner == 'AFK-surf' && needs.what.outputs.ios == 'yes' && needs.ios-shell.outputs.have == 'yes'
    runs-on: xcode-27
    # (a run by hand, or the day's, compiles what main's store has none of whole: once the units' commands named mbui at
    # libs/ui, 2026-11-13, none of the store's were theirs, and a push's 5 minutes saw 3 of it go)
    timeout-minutes: ${{ github.event_name == 'push' && 5 || 10 }}
    env:
      # (scripts/native.ts: GitHub's release API, asked when the release's download fails, with the job's token, not
      # the runners' shared address's anonymous quota: 403 there, main eb3f3a3a's ios, 43992166607)
      GH_TOKEN: ${{ github.token }}
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # (the shell's cargo build in the checkout, as mac-app.sh's is, for the cache below)
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/mbui/out/core-target
    steps:
      # (when the job is cut, its timeout-minutes above, for its build's own limit to the second (scripts/with-timeout.sh);
      # and the runner's image (GitHub's ImageVersion; none, a runner of our own: own), for the units' store: GitHub
      # gives a push one of two images while it moves to a newer one, and their compilers or headers make other units,
      # so one store over both kept only the last run's image's units (used.sh), the other's run compiling all again:
      # preview's ios on main, 20261104.0337.1 and 20261112.0361.1 in turn, 43919855625 to 43925936518, 2026-11-16)
      # (less the 1-5 s of "Set up job" before it and what GitHub counts past them: less 5, 45386683892's JOB_END was 301 s
      # after the job began, and cut 32 s before it the job was cancelled at 301 s; less 8, it is at 298. The SDK checked
      # in the same step, one step's start less; and the compiler's version, for the engine's key below, asked while the
      # machine is idle: asked beside moonc the key took 13 s there)
      - name: The job's end, its image and iOS's SDK 27.1 or later
        run: |
          echo "JOB_END=$(( $(date +%s) + ${{ github.event_name == 'push' && 5 || 10 }} * 60 - 8 ))" >> "$GITHUB_ENV"
          echo "IMG=$(printf '%s' "${ImageVersion:-own}" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_ENV"
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 20
          set -o pipefail
          cc=$(xcrun --sdk iphoneos clang++ --version)
          echo "IOS_CLANG_VERSION=${cc%%$'\n'*}" >> "$GITHUB_ENV"
          v=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $v ($(xcodebuild -version | head -1))"
          case "$v" in 2[0-6].*|27.0*) echo "::error::iOS SDK $v: an iPhone Duo letterboxes an app built before 27.1"; exit 1 ;; esac
      - uses: actions/checkout@v5
      # (mbc and chk alone: the other tools' keys and caches were 12 s of the job before moonc, 44411432671)
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc chk' }
      # moon's own build of the app (moonc's C, what it checked) as main's newest run left it, as check-mbui keeps its
      # own: without, moonc made all of it again each run, ~2 of the .ipa step's 2-3 minutes, the release's longest job
      # (main ca1e5c05, 40613958685, 2026-10-28). Main's only, as the units' store. (Without each program's objects: the
      # store keeps those.)
      - uses: actions/cache/restore@v4
        id: moon
        with:
          path: |
            apps/mbui/out/ios-device/_build
            !apps/mbui/out/ios-device/_build/**/*.mbc
          # (of no image: moonc is the same program on each, its C the same; keyed by the image, a run on the other
          # image found none and did moonc's work again, main fa3e94723, 44370994879)
          key: mbui-ios-moon-${{ github.sha }}
          restore-keys: mbui-ios-moon-
      # moonc's C (mbc gen) started at once, in the background, beside the caches' restores and the setup below: it reads
      # none of what they write (.ci's store and hbc, ~/Library/Caches, out/core, out/ios-assets-*, out/core-target),
      # and those ~30 s in a row before it left moonc and clang -O2 193 s of the job's 300 (44411432671, fc2ad0f66b).
      # Its processes carry the build's mark (MBUI_BUILD_TREE): a step stopped leaves them running, and the step after
      # the build stops what is left of them when it was cut (they wrote the store as the cache's tar read it).
      - name: Start Moon's build (moonc's C, beside the caches' restores)
        id: start
        run: |
          bash apps/mbui/scripts/moon-mtimes.sh
          touch "$RUNNER_TEMP/start"
          echo "$$-$(date +%s)-$RANDOM" > "$RUNNER_TEMP/build-tree"
          B=$RUNNER_TEMP/ios-gen
          mkdir -p "$B" apps/mbui/out/ios-device
          MBUI_BUILD_TREE=$(cat "$RUNNER_TEMP/build-tree") nohup bash -c '
            . apps/mbui/scripts/env.sh
            cd apps/mbui
            "$MBUI_DIR/scripts/mbc" gen --target-dir out/ios-device/_build src/stillfail > "$0/gen" 2> out/ios-device/moon.log
            echo $? > "$0/status.tmp" && mv "$0/status.tmp" "$0/status"
          ' "$B" > "$B/log" 2>&1 < /dev/null &
          echo "$!" > "$B/pid"
      # (restored on every run; saved by main's alone: a branch's would be its own, and the cache has 10 GB; before the
      # setup: whether core.hbc is in it says whether the job needs pnpm, below)
      # (the units alone: core.hbc, 33 MB of the 62-72, has its own cache below, and was taken and saved twice)
      - uses: actions/cache/restore@v4
        id: store
        with:
          path: .ci/mbc-store
          key: mbui-ios-${{ env.IMG }}-${{ github.sha }}
          # (this image's, else another's: each image's kept apart, above)
          restore-keys: |
            mbui-ios-${{ env.IMG }}-
            mbui-ios-
      # (until main's store is saved so: a cache is found by its path list too, so the stores kept with core.hbc beside
      # the units answer only this one; without it the first runs compile all ~1000 units cold, more than a push's 5
      # minutes. To go once main has saved one)
      - uses: actions/cache/restore@v4
        if: steps.store.outputs.cache-matched-key == ''
        with:
          path: |
            .ci/mbc-store
            .ci/hbc
          key: mbui-ios-${{ env.IMG }}-${{ github.sha }}
          restore-keys: |
            mbui-ios-${{ env.IMG }}-
            mbui-ios-
      # (Hermes for Apple and its hermesc by the versions core.sh pins, as pipeline.yml's desktop job keeps them)
      - id: hermes
        run: echo "key=$(grep -E '^HERMES_(RN|APPLE_URL|APPLE_SHA256)=' apps/mbui/scripts/core.sh | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/stillfail-build
            apps/mbui/out/core/hermesc
          key: mbui-hermes-apple-${{ steps.hermes.outputs.key }}
      # core.hbc in a cache of its own, not of the image's, as the linux and windows jobs keep it: the other image's
      # store held none made with the same hermesc, ~32 s of pnpm and Hermes again (main fa3e94723, 44370994879)
      - uses: actions/cache/restore@v4
        id: hbc
        with:
          path: .ci/hbc
          key: mbui-ios-hbc-${{ github.sha }}
          restore-keys: mbui-ios-hbc-
      # (the core's packages only for a core.hbc not kept for this commit's inputs: they are only esbuild's and Babel's,
      # and the core is unchanged in most runs)
      - id: core
        run: if bash apps/mbui/scripts/core.sh hermes-kept apple; then echo "kept=true" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup
        with: { pnpm: "${{ steps.core.outputs.kept != 'true' }}" }
      # core.hbc not kept: made at once, in the background (pnpm's packages, esbuild, hermesc: ~57 s), beside the restores
      # below and moonc's C, which it shares nothing with (it writes client/core-ts's packages, out/core's core-hermes.js
      # and core.hbc, .ci/hbc). Made in the build step after the restores, it ended 22 s after moonc's C and pushed mbc's
      # split and compile into the cut (main 31f2ead0ac and 873e7ac281, jobs 135458429309 and 135478118156: exit 124
      # at 288-289 s). Its processes carry the build's mark, stopped with the rest when the build is cut.
      - name: Start the core's bytecode (core.sh hermes apple, beside the restores)
        if: steps.core.outputs.kept != 'true'
        run: |
          H=$RUNNER_TEMP/ios-hermes
          mkdir -p "$H"
          MBUI_BUILD_TREE=$(cat "$RUNNER_TEMP/build-tree") SF_SRC=$PWD nohup bash -c '
            bash apps/mbui/scripts/core.sh hermes apple > "$0/log" 2>&1
            echo $? > "$0/status.tmp" && mv "$0/status.tmp" "$0/status"
          ' "$H" > /dev/null 2>&1 < /dev/null &
          echo "$!" > "$H/pid"
      # (its icon, drawn by scripts/mac-icon.swift run with swift and compiled by actool, made once for that script, as
      # the build does, not again on each fresh runner)
      - uses: actions/cache@v4
        with:
          path: apps/mbui/out/ios-assets-*
          key: mbui-ios-icon-${{ hashFiles('apps/mbui/scripts/mac-icon.swift', 'apps/mbui/scripts/ios.sh') }}
      # (shell-apple ios-arm64 in the native cache by its key, as the other jobs keep their engine and shell: a shell not
      # prebuilt yet is built here with cargo, ~4.5 min, in a run by hand alone: a push without it does not come here,
      # ios-shell)
      - name: The iOS shell's key
        id: native-keys
        run: echo "key=natives-shell-apple-ios-arm64-$(node scripts/native.ts key shell-apple ios-arm64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: shell
        with:
          path: ~/Library/Caches/stillfail-native/shell-apple
          key: ${{ steps.native-keys.outputs.key }}
      # (libghostty-vt ios-arm64 the same, by its own key: core.sh apple fetched it on every fresh runner, and the
      # release's one 504 failed main eb3f3a3a's, 43992166607, 2026-11-17)
      - name: The iOS libghostty-vt's key
        id: ghostty-key
        run: echo "key=natives-ghostty-vt-ios-arm64-$(node scripts/native.ts key ghostty-vt ios-arm64)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/stillfail-native/ghostty-vt
          key: ${{ steps.ghostty-key.outputs.key }}
      # (the device's engine, core.sh's libmbui_core.a for aarch64-apple-ios: compiled from apple_core.mm on every fresh
      # runner, 34 s of the build before ios.sh, and main c2e84024c's job 138301895231 was cut 10 s after mbc had linked
      # the app. Keyed by all it is made of, as pipeline.yml's desktop-build keeps the Mac's: its sources and the headers
      # they include, core.sh, the compiler, the iOS it is for and Hermes; only that exact key is taken, never an older
      # engine. Saved by main alone, below; mbui-testflight.yml takes it by the same key)
      - name: The iOS engine's key
        id: ios-engine-key
        run: |
          set -o pipefail
          # (its first line, the job's first step's; asked here only where that is empty, and cut here: a pipe into head
          # could end clang++ on a closed pipe, and pipefail the step)
          cc=${IOS_CLANG_VERSION:-}
          [ -n "$cc" ] || cc=$(xcrun --sdk iphoneos clang++ --version)
          cc=${cc%%$'\n'*}
          sources=$(shasum -a 256 apps/mbui/src/host/apple_core.mm apps/mbui/engine/ready_queue.h \
            apps/mbui/src/host/apple_collate.h apps/mbui/src/host/electron_sealed.h apps/mbui/src/host/core_api.h \
            apps/mbui/src/host/listen_api.h libs/ui/src/host/listen_api.h apps/mbui/scripts/core.sh)
          key=$(printf '%s\n' 'ios 17.0' "$cc" '${{ steps.hermes.outputs.key }}' "$sources" | shasum -a 256 | cut -c1-16)
          echo "key=mbui-ios-engine-$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: ios-engine
        with:
          path: apps/mbui/out/core/aarch64-apple-ios/libmbui_core.a
          key: ${{ steps.ios-engine-key.outputs.key }}
      # (newer than every source, which moon-mtimes.sh dates 2000-2008, and than core.sh, as engine() asks; ios.sh links
      # the app on a fresh runner whatever its mtime: no app is kept)
      - if: steps.ios-engine.outputs.cache-hit == 'true'
        run: touch apps/mbui/out/core/aarch64-apple-ios/libmbui_core.a
      # Always unsigned. TestFlight signing/upload is a separate manual workflow.
      # (the shell's cargo build, its dependencies kept, as main's newest that built it left it: a shell changed is built
      # here when not prebuilt yet, and from nothing that was 180-320 s of the job, a crate of its own again and again
      # (2026-10-29, five times on main); its dependencies change with Cargo.lock alone)
      - if: steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/mbui/out/core-target*/native/shell-apple
          key: shell-apple-target-ios-arm64-${{ hashFiles('client/Cargo.lock') }}-${{ github.sha }}
          # (or from a Cargo.lock before it: cargo builds again only the crates it changed, the rest as they were.
          # Keyed by the lock alone, a lock's change built all from nothing, 331 s of the macOS app's, bef99112's iroh)
          restore-keys: |
            shell-apple-target-ios-arm64-${{ hashFiles('client/Cargo.lock') }}-
            shell-apple-target-ios-arm64-
      # (a build cut short by its own limit, before the job's, still keeps what it compiled: main's store saved over what
      # was restored, nothing taken out, so the next run goes on from there, as the Linux jobs' do. Cut at the job's five
      # minutes it kept nothing: main's ten pushes up to c64dfaa7 (2026-11-16, libs/ui changed) each compiled from
      # the same old store till they were cut, 43908146733's after 254 s of it. Cut 24 s before the job is, moon's
      # build saved after the store too: the upload, the key and both saves after a whole build took 14 s
      # (43981912517), ~21 s on a slower runner, and the post steps ~6 s; after a cut the stop, the key, both saves and
      # the post steps 18 s (44411432671; 40 s before, 22 s of it went unused), 14 s in main's jobs 135458429309 and
      # 135478118156 (16 s of the 30 left unused). Cut at 24 s, the store's and hbc's saves left moon-room 11-13 s, under
      # its 18, and moon's build was never saved, each run's moonc 111 s again (44722052834). Cut at 32 s, a slow runner's
      # 45386683892 (the stop 1 s, the store's key and save 15, hbc's 4, the post steps 9) was cancelled at 301 s: cut at
      # 36 s of a JOB_END 3 s earlier, 7 s more, and moon-room takes a cut build's with 20 left, where 45370310593 and
      # 45355691252 would now have 25 and 28 (its key and save 9-10 s, the post steps 1-5). The core for a device first (its
      # engine, the shell's and libghostty-vt's headers; core.hbc, from the step that began it beside the restores or
      # HBC_CACHE's), beside moonc where that still runs, so that
      # ios.sh's own (app_libs, beside its mbc compile) only finds it and no unit reads ghostty/vt.h as it is copied;
      # then moonc's end awaited, ios.sh's mbc gen finding its C made. The .ipa: the app moved into Payload/ and back,
      # not copied, and zipped fast (-1: upload-artifact zips it again))
      - name: The iOS app for a device, as an .ipa
        id: build
        run: |
          export MBUI_BUILD_TREE=$(cat "$RUNNER_TEMP/build-tree")
          APP=stillfail MBUI_IOS_SDK=iphoneos MBUI_IOS_ID=fail.still.mbui SF_SRC=$PWD bash scripts/with-timeout.sh @$((JOB_END - 36)) bash -ec '
            bash apps/mbui/scripts/core.sh apple-native aarch64-apple-ios
            touch "$RUNNER_TEMP/ios-engine-made"
            H=$RUNNER_TEMP/ios-hermes
            if [ -f "$H/pid" ]; then
              while [ ! -s "$H/status" ]; do
                kill -0 "$(cat "$H/pid")" 2>/dev/null || { [ -s "$H/status" ] && break; cat "$H/log" 2>/dev/null || true; exit 1; }
                sleep 1
              done
              cat "$H/log"
              [ "$(cat "$H/status")" = 0 ] || exit 1
            else
              bash apps/mbui/scripts/core.sh hermes apple
            fi
            B=$RUNNER_TEMP/ios-gen
            while [ ! -s "$B/status" ]; do
              kill -0 "$(cat "$B/pid")" 2>/dev/null || { [ -s "$B/status" ] && break; cat "$B/log" apps/mbui/out/ios-device/moon.log 2>/dev/null || true; exit 1; }
              sleep 1
            done
            if [ "$(cat "$B/status")" != 0 ]; then
              cat "$B/log"
              libs/ui/scripts/chk errs < apps/mbui/out/ios-device/moon.log || true

          t0=$SECONDS
          export npm_config_script_shell="$(cygpath -w "$(command -v bash)")"
          (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline --reporter=append-only) || { echo "packages: pnpm install in client/core-ts failed"; exit 1; }
          echo "the core's packages in $((SECONDS - t0)) s"
          bash apps/mbui/scripts/win.sh core
          EOF
          nohup bash -c 'bash "$0/make.sh" > "$0/log" 2>&1; echo $? > "$0/status.tmp"; mv "$0/status.tmp" "$0/status"' "$H" > /dev/null 2>&1 < /dev/null &
      - name: Packages (the core's, the cloud's; the test station built)
        if: env.E2E == '1'
        run: |
          # (the packages' scripts in bash, not cmd: the station's build is sh)
          export npm_config_script_shell="$(cygpath -w "$(command -v bash)")"
          # (each quiet unless it fails, then all it said: pnpm says its errors on stdout, and a run that ended 127
          # with nothing said could not be told why, fix-update-jitter 40539668024)
          quiet() { "$@" > "$RUNNER_TEMP/packages.log" 2>&1 || { c=$?; cat "$RUNNER_TEMP/packages.log"; echo "packages: $* in $PWD: exit $c"; return $c; }; }
          # (append-only: what its install scripts run and say, in the log, not only the packages: the core's ended 127
          # once more with every package added and nothing said after, #6305's 43616724205, 2026-11-14; esbuild's
          # postinstall is the one script it runs, pnpm-workspace.yaml's onlyBuiltDependencies)
          (cd client/core-ts && quiet pnpm install --frozen-lockfile --prefer-offline --reporter=append-only)
          # (the root's, the cloud's and the test station's: the e2e flow's alone, as pipeline.yml's desktop-win installs
          # only the core's; the root's on NTFS beside clang-cl was some 15-20 s of a push's)
          [ -n "$E2E" ] || exit 0
          quiet pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          (cd cloud && quiet pnpm install --frozen-lockfile --prefer-offline)
          (cd station && quiet pnpm install --frozen-lockfile --prefer-offline && quiet pnpm run build:node)
      # The test station's natives (e2e/win.sh: mesh, runner and reader, win32-x64), by their keys. A change to one of them is in
      # no release yet and is built only by the pipeline's natives job (a Mac's cross-build: this machine has no zig):
      # then its end is waited for (an outside wait, its job's own state), and a branch takes what it built (its run's
      # artifact, as the pipeline's own jobs do, .github/actions/natives); main's it published to the release. None
      # missing, nothing waited for (the run of #1493 found mesh missing and failed building it here).
      - name: The test station's natives (the pipeline's natives job's, for a change to them)
        if: env.E2E == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=$(node scripts/native.ts missing mesh:win32-x64 runner:win32-x64 reader:win32-x64)
          [ -n "$missing" ] || exit 0
          echo "not in the release yet: $(echo $missing); the pipeline's natives job is waited for"
          need_natives=0 need_win_reader=0
          for p in $missing; do
            if [ "$p" = reader:win32-x64 ]; then need_win_reader=1; else need_natives=1; fi
          done
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          t0=$SECONDS run="" natives_state="" win_reader_state=""
          # (3 minutes: inside a push's 5; inside a run's of the day or by hand (its 10), up to JOB_END - 85 s so the
          # e2e flow and checks still fit after)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            deadline=$(( $(date +%s) + 180 ))
          else
            deadline=$(( JOB_END - 85 ))
            [ $(( deadline - $(date +%s) )) -ge 60 ] || deadline=$(( $(date +%s) + 60 ))
          fi
          # (main's: in the release, whichever run's natives job put them there. A run of main's still waiting to start
          # is cancelled by the next push's, which builds and publishes the same natives: 91434fca's was, and this step
          # waited for it until its 6 minutes ran out, the next one's in the release 2 minutes before, 40642483751.)
          main() { [ "$GITHUB_REF" = refs/heads/main ]; }
          while :; do
            ! main || [ -n "$(node scripts/native.ts missing mesh:win32-x64 runner:win32-x64 reader:win32-x64)" ] || { echo "(in the release after $((SECONDS - t0)) s)"; break; }
            [ -n "$run" ] || run=$(api "actions/workflows/pipeline.yml/runs?head_sha=$GITHUB_SHA&per_page=1" '.workflow_runs[0].id // empty' || true)
            if [ -n "$run" ]; then
              jobs=$(api "actions/runs/$run/jobs?per_page=100" '[.jobs[] | select(.name == "natives" or .name == "natives-win-reader" or .name == "natives-win-reader-main") | "\(.name)=\(.status) \(.conclusion // "")"] | join("\n")' || true)
              natives_state=$(printf '%s\n' "$jobs" | sed -n 's/^natives=//p' | head -1)
              if main; then
                win_reader_state=$(printf '%s\n' "$jobs" | sed -n 's/^natives-win-reader-main=//p' | head -1)
                # (on main, native.ts missing above is the only success exit: reader:win32-x64 is published by
                # natives-win-reader-main after natives finishes, so natives succeeding must not break out early;
                # fail fast only if a needed job itself failed)
                if [ "$need_natives" = 1 ] && [ "$natives_state" = "completed failure" ]; then
                  echo "::error::the pipeline's natives job ended $natives_state (run $run)"; exit 1
                fi
                if [ "$need_win_reader" = 1 ]; then
                  if [ "$win_reader_state" = "completed failure" ]; then
                    echo "::error::the pipeline's natives-win-reader-main job ended $win_reader_state (run $run)"; exit 1
                  elif [ "$win_reader_state" = "completed skipped" ] && [ "$natives_state" = "completed failure" ]; then
                    echo "::error::the pipeline's natives job ended $natives_state (run $run)"; exit 1
                  fi
                fi
              else
                win_reader_state=$(printf '%s\n' "$jobs" | sed -n 's/^natives-win-reader=//p' | head -1)
                natives_ok=1 win_ok=1
                if [ "$need_natives" = 1 ]; then
                  case "$natives_state" in
                    "completed success") ;;
                    completed*) echo "::error::the pipeline's natives job ended $natives_state (run $run)"; exit 1 ;;
                    *) natives_ok=0 ;;
                  esac
                fi
                if [ "$need_win_reader" = 1 ]; then
                  case "$win_reader_state" in
                    "completed success") ;;
                    "completed skipped")
                      # (with vars.CI_1 == 'off', natives builds reader:win32-x64 itself)
                      case "$natives_state" in
                        "completed success") ;;
                        completed*) echo "::error::the pipeline's natives job ended $natives_state (run $run)"; exit 1 ;;
                        *) win_ok=0 ;;
                      esac ;;
                    completed*) echo "::error::the pipeline's natives-win-reader job ended $win_reader_state (run $run)"; exit 1 ;;
                    *) win_ok=0 ;;
                  esac
                fi
                [ "$natives_ok" = 1 ] && [ "$win_ok" = 1 ] && break
              fi
              # (main's run of this commit cancelled before its natives were published, a newer push's in its place, the
              # natives not in the release: this commit's release is the newer one's to make, as the pipeline's was. This
              # run is cancelled as that one was, not failed: 3a22a53f's waited its 6 minutes and failed, the next run's
              # natives job begun 1 minute after, 40837737154, 2026-10-29)
              if main && [ "$(api "actions/runs/$run" '.status + " " + (.conclusion // "")' || true)" = "completed cancelled" ]; then
                echo "main's pipeline run of this commit was cancelled (run $run), a newer push's in its place: this run is cancelled too"
                gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
                sleep 120; exit 1
              fi
            fi
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error::the pipeline's natives jobs not done after $((SECONDS - t0)) s (run ${run:-not found}; natives=${natives_state:-none}, win-reader=${win_reader_state:-none})"; exit 1; }
            sleep 5
          done
          echo "(its natives job done after $((SECONDS - t0)) s: run $run)"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            mkdir -p "$RUNNER_TEMP/natives"
            if [ "$need_natives" = 1 ] || [ "$win_reader_state" = "completed skipped" ]; then
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-$GITHUB_SHA" -D "$RUNNER_TEMP/natives"
            fi
            if [ "$need_win_reader" = 1 ] && [ "$win_reader_state" = "completed success" ]; then
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "natives-win-reader-$GITHUB_SHA" -D "$RUNNER_TEMP/natives"
            fi
            node scripts/native-handoff.mjs get "$RUNNER_TEMP/natives" "$GITHUB_SHA"
            echo "STILLFAIL_NATIVE_INBOX=$RUNNER_TEMP/natives" >> "$GITHUB_ENV"
          fi
      # The still.fail the e2e flow signs in against (its cloud, relay, station and chat: ~13 s of the flow's ~18, none
      # of it the app's) made while cl compiles the app and the core's bytecode is made: started as soon as the packages
      # are (the cloud's, the station's dist) and the station's natives, not after the checks below (it was ~30 s of the
      # job's ~185-215 behind them, 2026-10-28, 40638451981); the flow waits for the app (E2E_APP: "Build
      # (APP=stillfail)" says it is whole), then runs it. Waited for at the end, with the installer's put (main's), the
      # cache's save and the order of names' and the sealed values' checks beside it.
      - name: The e2e flow started (e2e/win.sh, the app waited for)
        if: env.E2E == '1'
        run: |
          E=$RUNNER_TEMP/e2e; mkdir -p "$E"
          nohup bash -c 'E2E_APP="$0/app" bash apps/mbui/e2e/win.sh > "$0/log" 2>&1; echo $? > "$0/status"' "$E" > /dev/null 2>&1 &
      - name: The core's bytecode (Hermes)
        if: env.E2E == '1' || steps.core.outputs.kept == 'true'
        run: |
          bash apps/mbui/scripts/win.sh core
          [ ! -d .ci/hbc ] || echo "HBC_CACHE: $(ls .ci/hbc | wc -l) files, $(du -sm .ci/hbc | cut -f1) MB"
          [ ! -d .ci/hbc ] || echo "HBC_KEY=mbui-win-hbc-$(ls .ci/hbc | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
      - name: Build (APP=stillfail)
        id: build
        run: |
          B=$RUNNER_TEMP/build E=$RUNNER_TEMP/e2e; mkdir -p "$E"
          # (the e2e flow told the app is not coming, else it would wait its 10 minutes)
          trap '[ -s "$E/app" ] || echo failed > "$E/app"' EXIT
          # the installer's own program made while the app compiles (win.sh setup takes it), not beside the e2e flow
          bash apps/mbui/scripts/win.sh setup-bare
          # (a push's till what follows a build done still fits before the job's end (JOB_END): a branch's put, checks,
          # store and reuse of its objects, 48 s (43998071944, done 37 s before the end and cancelled at it with 45 s
          # left to them); main's put, build cache, checks, stores and installer's publish, 65 s (43990130513). Cut,
          # the stop, the key and the save take ~10 s of that. Waited 420 s, a push's build that had much to compile
          # was cut at the job's 5 minutes and kept none of it, the next push as far behind; a fixed 115 s, it was cut
          # with 39-64 s of the job unused, main 6c66e773, 21ec95ea and eb3f3a3a in a row, 2026-11-17: 43989080704,
          # 43989906170, 43992166607)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # (main's 55 since the build cache's save runs beside the installer's put, not before it)
            reserve=$([ "$GITHUB_REF" = refs/heads/main ] && echo 55 || echo 60)
            wait=$(( JOB_END - $(date +%s) - reserve ))
            [ "$wait" -ge 30 ] || wait=30
          else
            wait=420
          fi
          t0=$SECONDS
          while [ ! -s "$B/status" ]; do
            [ $((SECONDS - t0)) -lt $wait ] || { echo "::error::the build not done after $wait s"; tail -60 "$B/log"; exit 1; }
            sleep 1
          done
          echo "(waited $((SECONDS - t0)) s for it)"
          cat "$B/log"
          [ "$(cat "$B/status")" = 0 ] || exit 1
          # (a push's core made below the build's priority, above: waited for within the same wait)
          H=$RUNNER_TEMP/core
          if [ -d "$H" ]; then
            t1=$SECONDS
            while [ ! -s "$H/status" ]; do
              [ $((SECONDS - t0)) -lt $wait ] || { echo "::error::the core's bytecode not done after $wait s"; cat "$H/log"; exit 1; }
              sleep 1
            done
            echo "(waited $((SECONDS - t1)) s for the core after the app)"
            cat "$H/log"
            [ "$(cat "$H/status")" = 0 ] || { echo "::error::the core's packages or bytecode failed"; exit 1; }
            [ ! -d .ci/hbc ] || echo "HBC_CACHE: $(ls .ci/hbc | wc -l) files, $(du -sm .ci/hbc | cut -f1) MB"
            [ ! -d .ci/hbc ] || echo "HBC_KEY=mbui-win-hbc-$(ls .ci/hbc | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
          fi
          bash apps/mbui/scripts/win.sh put
          echo ok > "$E/app"
          # the cache's key: the app's C by its content (a C as the restored one was is not saved again)
          d=$(sh apps/mbui/scripts/mbui.sh)
          c=$(sha256sum "$d/out/win/app/_build/native/release/build/stillfail/stillfail/stillfail.c" | cut -c1-16)
          echo "BUILD_KEY=mbui-win-build-mono-$c" >> "$GITHUB_ENV"
          # the installer (apps/mbui/windows/setup.c) made of the app as built (out/setup, made anew: rm -rf), here, so
          # that the release's signing (beta.sh win, which only reads it) starts as soon as the app is built; its raw
          # form as --pack writes it beside it, which e2e/win/setup.sh holds to the bytes --raw makes (the release's)
          MBUI_SETUP_RAW="$PWD/apps/mbui/out/setup/stillfail-setup-0.1.$(git rev-list --count HEAD).exe.raw" bash apps/mbui/scripts/win.sh setup
      # (main's push: the installer signed and its raw form made while what is below runs, on this machine alone:
      # beta.sh win reads out/setup's installer, copies it and writes only its own folders (MBUI_CACHE's), nothing
      # put anywhere; its put is started only once the checks below passed. One after another the signing began at
      # 279 s of the job's 300, and its put was cut, 43908146733)
      - name: The Windows app's installer signed, started
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          # its .sig, which the feed carries (the app takes a build only as it says it: scripts/release-sign.ts)
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          MBUI_CACHE: ${{ runner.temp }}/mbui-release
        run: |
          # (beta.sh's python3: Windows' is `python`, UTF-8 for the feed's news; its shasum -a 256: Git Bash's sha256sum,
          # without the backslash it puts before a line whose name has one, as MBUI_CACHE's D:\a\_temp: the sum taken
          # by its first field was then never the one fetched back)
          mkdir -p "$RUNNER_TEMP/bin" && printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3" && chmod +x "$RUNNER_TEMP/bin/python3"
          cat > "$RUNNER_TEMP/bin/shasum" <<'EOF'
          #!/bin/sh
          [ "$1" = -a ] && shift 2
          sha256sum "$@" | sed 's/^\\//'
          EOF
          chmod +x "$RUNNER_TEMP/bin/shasum"
          export PATH="$RUNNER_TEMP/bin:$PATH" PYTHONUTF8=1
          # (its summary lines kept beside it: this step's own summary file is done with before they come)
          Z=$RUNNER_TEMP/zip; mkdir -p "$Z"
          export GITHUB_STEP_SUMMARY="$Z/summary"
          nohup bash -c 'bash apps/mbui/scripts/beta.sh win > "$0/log" 2>&1; echo $? > "$0/signed"' "$Z" > /dev/null 2>&1 &
      # the installer (apps/mbui/windows/setup.c) made of the app as built, put into a folder of this run's, put again
      # over it, taken away (e2e/win/setup.sh: ~12 s), and beside it the synchronous answers across the engine DLL
      # (engine-sync); then the three host checks begun before the caches were restored (collate, sealed, hello: the
      # step `Host checks (collate, sealed, hello), started`), each waited for by its status file and its log shown.
      # Each writes only its own directory (setup's in RUNNER_TEMP, out/collate, out/engine-sync, out/sealed, out/hello):
      # one after another the first four were 21 s of the job's 300, which main's 44497568003 ran out of 1-2 s short of
      # saving its caches; hello alone then grew to 41-72 s on cold runners (44733105178, 44757376609).
      - name: The installer, installed and taken away (e2e/win/setup.sh) and engine-sync beside it; collate, sealed, hello and reports collected
        run: |
          L=$RUNNER_TEMP/win-checks; mkdir -p "$L"
          t0=$SECONDS
          bash apps/mbui/e2e/win/setup.sh "$(ls apps/mbui/out/setup/stillfail-setup-*.exe)" > "$L/setup.log" 2>&1 & p_setup=$!
          bash apps/mbui/scripts/win.sh engine-sync > "$L/engine-sync.log" 2>&1 & p_engine=$!
          bad=0
          for c in setup:$p_setup engine-sync:$p_engine; do
            s=0; wait "${c#*:}" || s=$?
            echo "::group::${c%%:*} (exit $s)"; cat "$L/${c%%:*}.log"; echo "::endgroup::"
            [ "$s" = 0 ] || { echo "::error::${c%%:*} failed (exit $s)"; bad=1; }
          done
          echo "setup and engine-sync side by side: $((SECONDS - t0)) s"
          for c in collate sealed hello reports; do
            if [ ! -s "$L/$c.status" ]; then
              node apps/mbui/scripts/waitfor.mjs --deadline 60 --what "win.sh $c" --exists "$(cygpath -w "$L/$c.status")" > /dev/null || true
            fi
            s=$(tr -d '\r\n' < "$L/$c.status" 2>/dev/null); s=${s:-none}
            echo "::group::$c (exit $s)"; cat "$L/$c.log" 2>/dev/null; echo "::endgroup::"
            [ "$s" = 0 ] || { echo "::error::$c failed (exit $s)"; bad=1; }
          done
          echo "the six collected: $((SECONDS - t0)) s"
          exit $bad
      # out before the e2e flow ends (its tests hold nothing back): put, checked, then its feed, once its signing (begun
      # after the build) is over, beside the caches' saves and the e2e flow (the put mostly waiting on the network)
      - name: The Windows app's installer put, checked, then its feed, started
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MBUI_CACHE: ${{ runner.temp }}/mbui-release
          # (its deltas within the 150 s the step after waits for the whole of it: what is not made by then is left out;
          # 25 s since #6684 made them 1.6 times as fast)
          STILLFAIL_DELTAS_SECONDS: 25
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH" PYTHONUTF8=1
          Z=$RUNNER_TEMP/zip
          export GITHUB_STEP_SUMMARY="$Z/summary"
          nohup bash -c 'while [ ! -s "$0/signed" ]; do sleep 1; done; [ "$(cat "$0/signed")" = 0 ] && bash apps/mbui/scripts/beta.sh publish win >> "$0/log" 2>&1; echo $? > "$0/status"' "$Z" > /dev/null 2>&1 &
      # main's, saved when its C is new (a branch reads main's: its own would be its alone), once the installer's put has
      # started, its ~160 MB packed and sent while the put waits on the network: not after the checks below, where a run
      # cut at its five minutes saved none, and every run after built from the last one saved again, 159-178 s where it
      # had taken 72, and was cut the same (main 7f153d7b and 6222bae5, and each branch after them, 2026-11-15)
      - if: github.ref == 'refs/heads/main' && env.BUILD_KEY != steps.build-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            libs/ui/_build
            libs/ui/out
          key: ${{ env.BUILD_KEY }}
      # (main's however the build ended: one cut short keeps what it compiled, nothing taken out, so the next run goes on
      # from there, as the Linux jobs' do; a branch's only of a build that went through, as theirs; what it left running (moon, mbc, clang-cl) stopped first
      # and their locks taken out, so the store is still as it is tarred: mbui-check.yml's save failed so, 43839505847)
      - name: The units, by what they hold
        if: always() && steps.build.outcome != 'skipped'
        run: |
          B=$RUNNER_TEMP/build
          if [ "${{ steps.build.outcome }}" = success ]; then
            sh apps/mbui/scripts/used.sh "$RUNNER_TEMP/start" .ci/mbc-store
          else
            [ ! -s "$B/winpid" ] || taskkill //F //T //PID "$(cat "$B/winpid")" > /dev/null 2>&1 || true
            taskkill //F //IM moon.exe //IM moonc.exe //IM mbc.exe //IM clang-cl.exe //IM cl.exe //IM link.exe > /dev/null 2>&1 || true
            sleep 1
            find .ci/mbc-store -name '*.lock' -delete 2>/dev/null || true
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "a branch's build that did not go through: its store not saved"; exit 0; }
          fi
          echo "units: $(find .ci/mbc-store -mindepth 2 -maxdepth 2 -type d 2>/dev/null | wc -l)"
          echo "STORE_KEY=mbui-win-store-${{ github.ref == 'refs/heads/main' && 'm' || 'b' }}-$(sh apps/mbui/scripts/held.sh .ci/mbc-store)" >> "$GITHUB_ENV"
      - if: always() && env.STORE_KEY != '' && env.STORE_KEY != steps.store.outputs.cache-matched-key && env.STORE_KEY != steps.own.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/mbc-store
          key: ${{ env.STORE_KEY }}
      # main's core.hbc kept (HBC_CACHE: the newest 8, beside the put and the e2e flow, and after mbc-store when a
      # build was cut short so the next push finds core.hbc kept and skips pnpm + Hermes instead of rebuilding both:
      # 44100344729, 44101911655, 44108899153, 2026-11-17)
      - if: always() && !cancelled() && github.ref == 'refs/heads/main' && env.HBC_KEY != '' && env.HBC_KEY != steps.hbc.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: .ci/hbc
          key: ${{ env.HBC_KEY }}
      # (main's build cut short: the app's C moonc wrote whole (mbc had split it) kept as mbui-win-build-mono-moon-<its
      # key>, so the next run, this job's or the pipeline's desktop-win, goes on from it without moonc's ~60 s again; a
      # build whole saves under the key without -moon- above. Cut, the C and moon's .core were thrown away with the
      # rest, and each run after began moonc again from the last build saved, 2026-11-17)
      - name: The app's C, of a build cut short
        id: moon-key
        if: always() && github.ref == 'refs/heads/main' && steps.build.outcome == 'failure'
        run: |
          d=$(sh apps/mbui/scripts/mbui.sh)
          c=$d/out/win/app/_build/native/release/build/stillfail/stillfail/stillfail.c
          if [ -s "$c" ] && grep -q '^mbc: stillfail\.c: .* units in ' "$d/out/mbc.log" 2>/dev/null; then
            echo "key=mbui-win-build-mono-moon-$(sha256sum "$c" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
      - if: always() && steps.moon-key.outputs.key != '' && steps.moon-key.outputs.key != steps.build-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            libs/ui/_build
            libs/ui/out
          key: ${{ steps.moon-key.outputs.key }}
      - name: The Windows app's installer signed, put, checked, then its feed
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          Z=$RUNNER_TEMP/zip
          node apps/mbui/scripts/waitfor.mjs --deadline 150 --what "the installer's put" --exists "$(cygpath -w "$Z/status")" > /dev/null || { cat "$Z/log"; exit 1; }
          cat "$Z/log"
          cat "$Z/summary" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "$(cat "$Z/status")" = 0 ]
      - name: Signed in against a local still.fail, then Home (e2e/win.sh)
        if: env.E2E == '1'
        run: |
          E=$RUNNER_TEMP/e2e
          node apps/mbui/scripts/waitfor.mjs --deadline 150 --what "the e2e flow" --exists "$(cygpath -w "$E/status")" > /dev/null || { cat "$E/log"; exit 1; }
          cat "$E/log"
          [ "$(cat "$E/status")" = 0 ]
      # Each desktop app still Electron's as released (the beta, the stable one), installed, moved over to this app built
      # as it by its own updater (e2e/win/handoff.sh: ~1-2 min each), for a change to what that goes by (the what job).
      # Last: it builds the app again as the desktop app, in the place the e2e flow and the installer's put take it from.
      - name: The desktop app moved over to this app by its own updater (e2e/win/handoff.sh)
        if: env.E2E == '1' && needs.what.outputs.handoff == 'yes'
        run: bash apps/mbui/e2e/win/handoff.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbui-windows-${{ github.sha }}
          # (not the core's files: a sign-in, though the local cloud's)
          path: |
            apps/mbui/out/e2e/windows/
            !apps/mbui/out/e2e/windows/core/
            apps/mbui/out/setup/*.log
            apps/mbui/out/setup/result.txt
            apps/mbui/out/handoff/*/*.log
            apps/mbui/out/handoff/*/*.txt
          if-no-files-found: warn
      # The release variants change only resources. Rebuilding one from this app's cache must reuse its C objects;
      # otherwise a release recompiles the whole app before it can publish any platform's update. (Its resources under
      # the same name as the app's, win.sh's res: moon makes nothing of the app again, not even its C; the program alone
      # is linked again, with the beta's resources.)
      - name: The beta Windows app reuses the app's compiled objects
        if: github.ref != 'refs/heads/main' && github.event_name == 'push' && needs.what.outputs.win_build == 'yes'
        run: |
          L=$RUNNER_TEMP/beta-cache.log
          MBUI_VARIANT=beta MBUI_WIN_CORE=0 bash apps/mbui/scripts/win.sh build > "$L" 2>&1 || { cat "$L"; exit 1; }
          grep 'mbc: ' "$L" | grep -v 'as is' || true
          ! grep -Eq 'stillfail.c: [1-9][0-9]* of [0-9]+ compiled' "$L" || { echo "beta build recompiled the app"; exit 1; }
          grep -q 'linked stillfail.exe' "$L" || { echo "beta build did not link the program again with its resources"; exit 1; }

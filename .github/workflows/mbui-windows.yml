# mbui (libs/ui, zzj3720/mbui merged in 2026-10-21): its own workflow, as it had it there, run in its directory.
# The demo on Windows: build with MoonBit and MSVC, its input method's script run in a window (Direct3D falls back to
# WARP on the GPU-less runner), text against DirectWrite's own, and WebView2, as independent jobs. No picture of the
# app's window is compared with a kept one (goldens/windows.png is scripts/shots.sh's, by hand): what Direct3D draws is held to its references
# by mbui-render-windows (a Tester's draw list drawn offscreen), as the macOS job does (mbui-ci.yml).
name: mbui-windows
on:
  # (on main as on a branch, only when what it builds changed: on every push to main it ran 77 times in three days,
  # a commit to the station's code as well)
  push:
    branches: [main]
    paths: ["libs/ui/**", ".github/workflows/mbui-windows.yml", ".github/actions/mbui-moonbit/**", ".github/actions/msvc/**"]
  pull_request:
    paths: ["libs/ui/**", ".github/workflows/mbui-windows.yml", ".github/actions/mbui-moonbit/**", ".github/actions/msvc/**"]
  workflow_dispatch:
    inputs:
      stillfail_ref:
        description: "also build still.fail's apps/mbui sffix (AFK-surf/monoid at this ref) and shoot its wide frame"
        required: false
        default: ""


jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 5
    # Each builds its own program. In run 41539716977 attempt 2, setup, the demo and textdiff used 294 s before
    # webdemo even began to build. Keep each contract's five-minute limit, without spending it on the others first.
    strategy:
      fail-fast: false
      matrix:
        check: [ime, text, webviews]
    # (the units mbc compiles kept by content, MBC_STORE: restored on every run, saved by main's alone; without them
    # each run compiled the demo, textdiff and webdemo whole, 193 s on average and 466 s at most, 2026-10-22)
    env:
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
    defaults:
      run:
        working-directory: libs/ui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      # MoonBit's latest release, kept in the Actions cache by the ETags of its two downloads (the binaries and the
      # core, a HEAD each): installed (~16 s, most of it bundling the core) only when either changed. No answer: no
      # key, installed as before.
      - uses: ./.github/actions/mbui-moonbit
      # The SDK is pinned by win.sh's WV2_VERSION. Keep its download out of a demo's build on later runs.
      - uses: actions/cache@v4
        with:
          path: libs/ui/out/webview2
          key: mbui-webview2-${{ hashFiles('libs/ui/scripts/win.sh') }}
          restore-keys: mbui-webview2-
      - uses: actions/cache/restore@v4
        with:
          path: .ci/mbc-store
          key: mbui-windows-demo-${{ matrix.check }}-${{ github.sha }}
          restore-keys: |
            mbui-windows-demo-${{ matrix.check }}-
            mbui-windows-demo-
      # (what the store's units were before this run's own: those it did not use, and none for three hours, go before
      # main's save below)
      - run: touch "$RUNNER_TEMP/start"
      - name: Build
        if: matrix.check == 'ime'
        run: |
          moon version --all
          scripts/win.sh build
          echo "binary: $(stat -c %s out/win/mod/_build/native/release/build/demo/demo.exe) bytes"
      - name: IME script
        if: matrix.check == 'ime'
        run: scripts/win.sh script ime
      - name: Text against DirectWrite's own (scripts/textdiff.sh windows; the report is in the artifact)
        if: matrix.check == 'text'
        run: |
          mkdir -p out/node && (cd out/node && { [ -f package.json ] || npm init -y >/dev/null; } && npm i pngjs >/dev/null)
          export MBC_LOG="$RUNNER_TEMP/mbc.log"
          s=$SECONDS
          scripts/textdiff.sh windows
          echo "textdiff: $((SECONDS - s)) s, its build's C:"
          grep -E ' compiled \(|^mbc: linked' "$MBC_LOG" | cut -c1-220 || true
      - name: Web views (WebView2) - a page, a site the app answers, and with no runtime to be had
        if: matrix.check == 'webviews'
        run: |
          APP=webdemo scripts/win.sh build
          mkdir -p out/webviews
          D=$(cygpath -w "$PWD/out/webviews")
          EXE=out/win/mod/_build/native/release/build/webdemo/webdemo.exe
          # the runtime's first start on this machine, not looked at: on the 20261030 image (runtime 156) the first web
          # views a fresh runner makes take ~35 s (5 s its environment, 30 s its views), every start after it ~0.5 s, with
          # a user data folder of its own too (2026-10-30, the webview2-slow-diag runs); the image before it, ~2 s
          MBUI_BENCH=-1 MBUI_SCRIPT=shot MBUI_SHOT_NAME=webviews-first MBUI_SHOT_DIR="$D" ./$EXE > out/webviews/webviews-first.log 2>&1 || true
          MBUI_SHOT_SCREEN=1 MBUI_BENCH=-1 MBUI_SCRIPT=shot MBUI_SHOT_NAME=webviews MBUI_SHOT_DIR="$D" ./$EXE 2>&1 | tee out/webviews/webviews.log
          # the runtime looked for where there is none (as on a machine without it): every view says it cannot be shown
          MBUI_WEBVIEW2_DIR='C:\no-webview2-here' MBUI_BENCH=-1 MBUI_SCRIPT=shot MBUI_SHOT_NAME=webviews-none \
            MBUI_SHOT_DIR="$D" ./$EXE 2>&1 | tee out/webviews/webviews-none.log
          for want in "view 1: page loaded" "view 2: site page loaded" "view 1: told 1" "view 2: told 0" "view 2: told 1" \
                      "site asked GET /style.css" "site asked POST /api/echo (page false, body 7 bytes)" "SHOT .* ok"; do
            grep -q "$want" out/webviews/webviews.log || { echo "webviews.log: no \"$want\""; exit 1; }
          done
          grep -q "no WebView2 runtime" out/webviews/webviews-none.log || { echo "webviews-none.log: the runtime was found"; exit 1; }
          grep -q "SHOT .* ok" out/webviews/webviews-none.log
      # Main's store keeps what its runs used for three hours (as mbui-check's): saved whole, run after run it kept every
      # unit it ever took in, 428 MB a check, 1,284 MB of main's caches for the three (2026-11-17).
      - name: Prune unused units from the demo's store
        if: always() && github.ref == 'refs/heads/main'
        run: |
          [ -d "$MBC_STORE" ] || exit 0
          find "$MBC_STORE" -name '*.lock' -delete 2>/dev/null || true
          find "$MBC_STORE" -mindepth 2 -maxdepth 2 -type d ! -newer "$RUNNER_TEMP/start" -mmin +180 -exec rm -rf {} +
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .ci/mbc-store
          key: mbui-windows-demo-${{ matrix.check }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-shots-${{ matrix.check }}
          path: |
            libs/ui/out/webviews/
            libs/ui/out/shot-kit/
            libs/ui/out/ime/
            libs/ui/out/photos/
            libs/ui/out/textdiff/
          if-no-files-found: warn

  # still.fail's app over made-up data (its apps/mbui sffix, against this mbui), asked for by a run's stillfail_ref: built
  # here, shot by stillfail-shots in each face at once (the build alone is three of a job's five minutes).
  stillfail:
    if: github.event_name == 'workflow_dispatch' && inputs.stillfail_ref != ''
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
    defaults:
      run:
        working-directory: libs/ui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/msvc
      # MoonBit's latest release, kept in the Actions cache by the ETags of its two downloads (the binaries and the
      # core, a HEAD each): installed (~16 s, most of it bundling the core) only when either changed. No answer: no
      # key, installed as before.
      - uses: ./.github/actions/mbui-moonbit
      - uses: actions/cache/restore@v4
        with:
          path: |
            libs/ui/_build
            libs/ui/out
          key: mbui-win-build-mono-${{ github.sha }}
          restore-keys: mbui-win-build-mono-
      - uses: actions/cache/restore@v4
        with:
          path: .ci/mbc-store
          key: mbui-win-sffix-store-${{ github.sha }}
          restore-keys: |
            mbui-win-sffix-store-
            mbui-win-store-b-
      - name: Build sffix
        run: |
          APP=sffix bash ../../apps/mbui/scripts/win.sh build
          mkdir -p out/sffix && cp "$(ls out/win/app/_build/native/release/build/*/sffix/sffix.exe)" out/sffix/
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .ci/mbc-store
          key: mbui-win-sffix-store-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: sffix-windows
          path: libs/ui/out/sffix/

  # Its wide frame (a desktop's window) at 150% (MBUI_SCALE=1.5, as a 4K screen at 150% has it), light and dark, in each
  # face (the app's own: Inter, Han in Microsoft YaHei UI; Segoe UI Variable; Noto Sans SC's variable file), and the
  # sidebar's hover moved down and up its rows as a video; the default face's leg also the pages at 100%, the chat at 1440×900 and a phone's.
  # For comparing with macOS's, by people: nothing checked.
  stillfail-shots:
    needs: stillfail
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        face: [own, segoe, noto]
    defaults:
      run:
        working-directory: libs/ui
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sffix-windows
          path: libs/ui/out/sffix/
      - name: Screenshots
        run: |
          mkdir -p out/shot-sf
          D=$(cygpath -w "$PWD/out/shot-sf")
          EXE=out/sffix/sffix.exe
          case "${{ matrix.face }}" in
            own) FACES="" ;;
            segoe) FACES="1:local:Segoe UI Variable;2:local:Segoe UI Variable" ;;
            noto)
              curl -fsSL -o NotoSansSC-VF.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
              FACES="1:NotoSansSC-VF.ttf;2:NotoSansSC-VF.ttf" ;;
          esac
          n=win-wide-chat-150pct-${{ matrix.face }}
          {
            echo "until 首页的列表改成按天分组"
            echo "shot hover-f00"
            f=1
            for y in 145 160 175 190 205 218 232 248 265 280 295 310 325 340 355 370 385 400 415 430 400 370 340 310 280 248 218 190 160; do
              printf "move 246 %d\nshot hover-f%02d\n" "$y" "$f"
              f=$((f + 1))
            done
            echo "hover 首页的列表改成按天分组"
            echo "shot hovered"
            echo "exit"
          } > out/shot-sf/hover.drive
          DRIVE_B64=$(base64 < out/shot-sf/hover.drive | tr -d '\n')
          for d in 0 1; do
            m=$n$([ $d = 1 ] && echo -dark || true)
            MBUI_FACES="$FACES" MBUI_DARK=$d MBUI_BENCH=-1 MBUI_SCALE=1.5 MBUI_WIN=1280x800 MBUI_FIXTURE=chat MBUI_SCRIPT=shot MBUI_SHOT_NAME=$m MBUI_SHOT_DIR="$D" ./$EXE
            MBUI_FACES="$FACES" MBUI_DARK=$d MBUI_BENCH=-1 MBUI_SCALE=1.5 MBUI_WIN=1280x800 MBUI_FIXTURE=chat MBUI_DRIVE_B64="$DRIVE_B64" MBUI_SHOT_DIR="$D" ./$EXE
            mv out/shot-sf/hovered.png out/shot-sf/$m-hover.png || true
            # the frames as they were shot, and whether any two the hand had at the same place differ (a row's words
            # drawn otherwise as the hover passes them back)
            mkdir -p out/shot-sf/$m-frames && cp out/shot-sf/hover-f*.png out/shot-sf/$m-frames/ || true
            ffmpeg -loglevel error -y -framerate 12 -i out/shot-sf/hover-f%02d.png -c:v libx264 -pix_fmt yuv420p out/shot-sf/$m-hover.mp4 || true
            rm -f out/shot-sf/hover-f*.png
          done
          if [ "${{ matrix.face }}" = own ]; then
            for m in home chat settings-appearance files; do
              for d in 0 1; do
                n=win-wide-$m$([ $d = 1 ] && echo -dark || true)
                MBUI_BENCH=-1 MBUI_WIN=1280x800 MBUI_DARK=$d MBUI_FIXTURE=$m MBUI_SCRIPT=shot MBUI_SHOT_NAME=$n MBUI_SHOT_DIR="$D" ./$EXE
              done
            done
            MBUI_BENCH=-1 MBUI_WIN=1440x900 MBUI_FIXTURE=chat MBUI_SCRIPT=shot MBUI_SHOT_NAME=win-wide-chat-1440 MBUI_SHOT_DIR="$D" ./$EXE
            MBUI_BENCH=-1 MBUI_WIN=390x844 MBUI_SCRIPT=shot MBUI_SHOT_NAME=win-phone-home MBUI_SHOT_DIR="$D" ./$EXE
          fi
          ls -la out/shot-sf
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: stillfail-windows-shots-${{ matrix.face }}
          path: libs/ui/out/shot-sf/
          if-no-files-found: warn

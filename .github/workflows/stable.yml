# Stable is never triggered by a push. Run workflow after reviewing the release notes.
name: Publish stable
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Optional full SHA (a main commit, or a release branch''s newest its notes name); empty selects the latest reviewed release notes'
        required: false
        type: string
concurrency:
  group: publish-stable
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  # Farview's client, for a release whose apps/mbui still pulls it (apps/mbui/scripts/farview.sh in its checkout: a
  # private repository, read by its deploy key). Stable runs this file from main against an older release's checkout;
  # remove once no release before #8534 is published.
  FARVIEW_DEPLOY_KEY: ${{ secrets.FARVIEW_DEPLOY_KEY }}
jobs:
  plan:
    if: github.repository_owner == 'AFK-surf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, fetch-tags: true, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - id: plan
        name: Pin a reviewed release with a successful pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: python3 .github/stable-plan.py

  # The Android app is mbui's (apps/mbui, its `stable` variant: fail.still.android, signed as the Kotlin app was, so an
  # installed one updates in place) since 2026-10-24, as asked; the Kotlin app stopped at 0.1.4520. 10 minutes (it runs
  # by hand): on 2026-11-11 still.fail's took 2m09s and monoid's was cut at the job's 5, which skipped the release after.
  android:
    needs: plan
    runs-on: [self-hosted, macos-ci]
    environment: production
    timeout-minutes: 10
    outputs:
      hand: ${{ steps.hand.outputs.key }}
      monoid: ${{ steps.monoid-upload.outcome == 'success' && '1' || '' }}
    env:
      GH_TOKEN: ${{ github.token }} # read-only API fallback if the public release download fails
    steps:
      # (when the job is cut, less its setting up: monoid's below ends before it)
      - run: echo "JOB_END=$(( $(date +%s) + 10 * 60 - 15 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Build and sign stable Android (mbui's) with its original signing key
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh --stable android
      # Stage the APK and symbols from Mini1 directly via Cloudflare's API (~15-20 s instead of computing and uploading
      # ~75 MB of deltas over Mini1's home uplink for ~5-6 minutes, 45502063213). Staging keeps any existing APK of the
      # same version untouched until android-feeds publishes APK, deltas, and android/latest.json together on ubuntu-24.04.
      - name: Stage its files and hand the feed to android-feeds
        id: hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          git cat-file -e "$GITHUB_SHA:scripts/release-put.sh" 2>/dev/null || git fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:scripts/release-put.sh" > "$RUNNER_TEMP/release-put.sh"
          STILLFAIL_RELEASE_TOOLS_ROOT="$GITHUB_WORKSPACE" sh "$RUNNER_TEMP/release-put.sh" --stage "$RUNNER_TEMP/release"
          STILLFAIL_RELEASE_TOOLS_ROOT="$GITHUB_WORKSPACE" sh "$RUNNER_TEMP/release-put.sh" --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"
      # monoid's (build.monoid.android, the same key): from the same build, in the same warm cache (only the package is
      # made again: its id, name and links are in its manifest and resources); put by monoid-android. Not a reason to hold
      # still.fail's release back: skipped without failing monoid-android when time is short or upload fails (45498745060).
      # Leave 165 s before JOB_END for monoid-upload (timeout-minutes: 2; 37 MB took 84 s in 45502063213) and cleanup so
      # optional monoid work cannot cancel android and skip web/station/site/done (44770813931, 45502063213).
      - name: Build and sign monoid's stable Android app from the same build
        id: monoid-build
        continue-on-error: true
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          RELEASE_DIR: ${{ runner.temp }}/monoid
        run: |
          left=$(( JOB_END - $(date +%s) - 165 ))
          if [ "$left" -lt 30 ]; then
            echo "::warning::skipping monoid's stable Android build: only ${left} s left before upload reserve"
            exit 1
          fi
          bash scripts/with-timeout.sh "@$(( JOB_END - 165 ))" sh .github/release.sh --product monoid --stable android
          left_up=$(( JOB_END - $(date +%s) ))
          if [ "$left_up" -ge 145 ]; then
            echo "packed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::skipping monoid's stable Android upload: only ${left_up} s left before job end"
          fi
      - if: steps.monoid-build.outcome == 'success' && steps.monoid-build.outputs.packed == '1'
        id: monoid-upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 2
        with: { name: "monoid-android-stable", path: "${{ runner.temp }}/monoid", if-no-files-found: error, retention-days: 1, compression-level: 0 }

  # The stable Android app's deltas, APK, symbols, and feed (staged by android), on Linux where Java compiles the delta
  # applier and uploads are fast, mirroring station-put/desktop-win-feeds and pipeline.yml's deltas-android.
  android-feeds:
    needs: [plan, android]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      HANDED: ${{ needs.android.outputs.hand }}
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/
            /shared/delta.ts
            /.node-version
            /.github/actions/node/
            /libs/ui/android/app/src/main/java/dev/mbui/Delta.java
            /libs/ui/android/jzlib/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/node
      - name: Its deltas, then its APK and feed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$HANDED" ] || { echo "no handoff key from android" >&2; exit 1; }
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --unhand "$RUNNER_TEMP/release" $HANDED
          sh scripts/release-put.sh --unstage "$RUNNER_TEMP/release"
          node scripts/release-deltas.ts "$RUNNER_TEMP/release" --deadline 180
          sh scripts/release-put.sh "$RUNNER_TEMP/release"
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --drop $HANDED

  # The Mac app is mbui's (apps/mbui, its `stable` variant: fail.still.desktop, signed by the same team, so an installed
  # Electron app's updater moves it over, its data and sign-in kept), as the beta's became on 2026-10-26. 10 minutes (it
  # runs by hand): the day before's main has no warm build, and its build and Apple's notary took 4m59s on 2026-11-12
  # and were cut at 5 on 2026-11-13.
  desktop:
    needs: plan
    runs-on: [self-hosted, macos-ci]
    environment: production
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }} # read-only API fallback if the public release download fails
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - uses: ./.github/actions/natives
      - name: Publish the stable Mac app (mbui's) with its original signing identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID and notary profile (.github/mac_signing.py).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
        run: sh .github/release-desktop.sh --stable
      # Only frees the runner's disk of the zip already put: it fetches the zip back from R2 to compare, which from mini1
      # took past the job's 10 minutes after the release was out (0.1.8947, two attempts, 2026-11-15), so it never fails
      # or holds back the release.
      - name: Remove the uploaded Mac zip's local copy
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          build=$(git rev-list --count HEAD)
          cache=${MBUI_MAC_CACHE:-"$HOME/stillfail-ci/mbui-mac-stable"}
          # (where scripts/beta.sh of the release's checkout builds: beside libs/ui once mbui is there)
          work=$cache/tree/apps/mbui; [ -d "$GITHUB_WORKSPACE/libs/ui" ] || work=$cache/work
          work=${WORK:-$work}
          if [ "${MBUI_FRESH:-}" = 1 ]; then work="$GITHUB_WORKSPACE/apps/mbui"; fi
          # The checkout is the reviewed release, which can be older than this workflow. Use this workflow's helper.
          git show "$GITHUB_SHA:scripts/release-put.sh" > "$RUNNER_TEMP/release-put-cleanup.sh"
          STILLFAIL_RELEASE_TOOLS_ROOT="$GITHUB_WORKSPACE" sh "$RUNNER_TEMP/release-put-cleanup.sh" --clean-uploaded "desktop/stillfail-0.1.$build-arm64-mac.zip" "$work/out/mac/stillfail-$build-arm64-mac.zip"

  # The Windows app is mbui's (apps/mbui, its `stable` variant: fail.still.desktop, its installer run by an installed
  # Electron app's updater, its data and sign-in kept), as the beta's became on 2026-10-26: built as the pipeline's
  # desktop-win job builds the beta's, from main's build as preview.yml's windows job left it in the Actions cache, its
  # installer's .sig signed (scripts/release-sign.ts), not code-signed. The release is the day before's main (#4929), whose
  # build the cache has often lost by then: the build restored is a later commit's, and rebuilding from it took 3m44s
  # on 2026-11-11 (48s from the commit's own), so the job has 10 minutes (it runs by hand).
  desktop-win:
    needs: plan
    runs-on: windows-2025
    environment: production
    timeout-minutes: 10
    outputs:
      monoid: ${{ steps.monoid-upload.outcome == 'success' && '1' || '' }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MSYS: winsymlinks:nativestrict
      HBC_CACHE: ${{ github.workspace }}/.ci/hbc
      # (main's units, the pipeline's and preview.yml's: read, never saved here)
      MBC_STORE: ${{ github.workspace }}/.ci/mbc-store
    # (set up as the pipeline's desktop-win is: pnpm and the core's packages only for a core.hbc not kept)
    steps:
      - shell: pwsh
        run: |
          $t = Get-Date
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:LOCALAPPDATA, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
          "Defender kept off them in $([int]((Get-Date) - $t).TotalMilliseconds) ms"
      # (the natives' keys are git's blobs: the checkout as git has it)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0, filter: "blob:none" } # its build is the commits in the history
      - id: node
        run: |
          d="$(cygpath -u "$RUNNER_TOOL_CACHE")/node/$(tr -d 'v[:space:]' < .node-version)/x64"
          [ -x "$d/node.exe" ] || exit 0
          cygpath -w "$d" >> "$GITHUB_PATH"
          echo "kept=true" >> "$GITHUB_OUTPUT"
      - if: steps.node.outputs.kept != 'true'
        uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      - uses: ./.github/actions/msvc
      # (the tools win.sh runs: mbc, chk and its packager, pack; not detlint, apk or testexe)
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc chk pack' }
      # (ghostty-vt's too where the release's checkout names it; win.sh gets it itself otherwise)
      - name: The Windows natives' keys
        id: native-keys
        run: echo "key=natives-win32-x64-$(node scripts/native.ts key shell win32-x64)-$(node scripts/native.ts key engine win32-x64)-$(node scripts/native.ts key ghostty-vt win32-x64 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/stillfail-native
          key: ${{ steps.native-keys.outputs.key }}
      - name: The Windows engine, shell and ghostty-vt, prebuilt
        run: |
          node scripts/native.ts fetch shell win32-x64
          node scripts/native.ts fetch engine win32-x64
          node scripts/native.ts fetch ghostty-vt win32-x64 || echo "(ghostty-vt not fetched: win.sh gets it)"
      # (main's build and units, the pipeline's and preview.yml's; read here, never saved)
      - uses: actions/cache/restore@v4
        with:
          path: |
            libs/ui/_build
            libs/ui/out
          key: mbui-win-build-mono-${{ needs.plan.outputs.sha }}
          restore-keys: mbui-win-build-mono-
      - uses: actions/cache/restore@v4
        with:
          path: .ci/mbc-store
          key: mbui-win-store-m-${{ needs.plan.outputs.sha }}
          restore-keys: mbui-win-store-m-
      # (the pipeline's desktop-win's, with PostHog's project in it as this one's; preview.yml's, without, for monoid's)
      - uses: actions/cache/restore@v4
        with:
          path: .ci/hbc
          key: mbui-win-posthog-hbc-${{ needs.plan.outputs.sha }}
          restore-keys: |
            mbui-win-posthog-hbc-
            mbui-win-hbc-
      # Whether pnpm, its store and the core's packages are needed: only for a core.hbc not kept, this app's (PostHog's
      # in it) or monoid's (none); a checkout from before core.sh's hermes-kept says neither kept
      - name: The core's bytecode, kept?
        id: hbc
        env:
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: |
          # the PostHog project its core sends what people use to (apps/mbui/scripts/core.sh posthog_define)
          if [ -n "${POSTHOG_JSON:-}" ]; then
            (umask 077 && printf '%s' "$POSTHOG_JSON" > "$RUNNER_TEMP/posthog.json")
            echo "POSTHOG_FILE=$RUNNER_TEMP/posthog.json" >> "$GITHUB_ENV"
          fi
          unset POSTHOG_JSON
          # the build's number, as release.sh has it: core.hbc's key says when it was built (apps/mbui/scripts/core.sh
          # built_at_define), so asked without it no key was the release's
          export MBUI_BUILD=$(git rev-list --count HEAD)
          export HERMESC=$(cygpath -m "$(node scripts/native.ts path engine win32-x64)/hermesc.exe")
          STILLFAIL_POSTHOG=$([ ! -s "$RUNNER_TEMP/posthog.json" ] || echo "$RUNNER_TEMP/posthog.json") bash apps/mbui/scripts/core.sh hermes-kept || exit 0
          bash apps/mbui/scripts/core.sh hermes-kept || exit 0
          echo "kept=true" >> "$GITHUB_OUTPUT"
      - if: steps.hbc.outputs.kept != 'true'
        uses: ./.github/actions/setup
      - name: The core's packages
        if: steps.hbc.outputs.kept != 'true'
        run: (cd client/core-ts && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
      - name: Build, pack and sign the stable Windows app
        env:
          # The installer's signature (its .sig): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          export STILLFAIL_POSTHOG=${POSTHOG_FILE:-}
          # This checkout is the reviewed release and can be older than the workflow.
          git show "$GITHUB_SHA:apps/mbui/scripts/win-compiler.sh" > "$RUNNER_TEMP/win-compiler.sh"
          . "$RUNNER_TEMP/win-compiler.sh"
          sh scripts/release.sh desktop-win
      # its files (named by its version: nothing points at them yet) put here; its feeds by desktop-win-feeds, after the
      # deltas to it, which are not this job's to make (it takes most of its 5 minutes already)
      - name: Put its files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --files "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with: { name: "release-desktop-win-stable", path: "${{ runner.temp }}/release", retention-days: 1 }
      # monoid's (build.monoid.desktop): the same program, linked again with its own resources (its id, name and
      # environment: apps/mbui/scripts/win.sh), nothing compiled again; put by monoid-desktop-win.
      - name: Pack and sign monoid's stable Windows app from the same build
        id: monoid-build
        continue-on-error: true
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/monoid
        run: |
          . "$RUNNER_TEMP/win-compiler.sh"
          sh scripts/release.sh --product monoid desktop-win
      - if: steps.monoid-build.outcome == 'success'
        id: monoid-upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 1
        with: { name: "monoid-desktop-win-stable", path: "${{ runner.temp }}/monoid", if-no-files-found: error, retention-days: 1 }

  # The stable Windows app's feeds (desktop-win put its files), after the deltas to it from the stable builds before
  # (scripts/release-deltas.ts, which fetches the installer's raw form back: a few minutes of a Linux runner's, never a
  # reason to hold the release back).
  desktop-win-feeds:
    needs: [plan, desktop-win]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "release-desktop-win-stable", path: "${{ runner.temp }}/release" }
      - name: Its deltas, then its feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/release" --deadline 200
          sh scripts/release-put.sh "$RUNNER_TEMP/release"

  # monoid's stable apps (apps/mbui's monoid variants on monoid's cloud: build.monoid.android, build.monoid.desktop), of
  # the same reviewed release as still.fail's, made from theirs (nothing compiled again) and put in monoid's bucket in the
  # company's Cloudflare account. Apart from done: still.fail's stable is recorded whatever they do.
  monoid-android:
    needs: [plan, android]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.android.outputs.monoid == '1' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "monoid-android-stable", path: "${{ runner.temp }}/monoid" }
      - name: Put it in monoid's bucket (its files and deltas, then its feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/monoid" --releases https://app.monoid.build/releases --deadline 150
          sh scripts/release-put.sh "$RUNNER_TEMP/monoid"

  # monoid's Mac app: still.fail's stable one (as the desktop job put it) renamed, not built again: the same program,
  # Hermes, bytecode and icon, its own Info.plist, program name and updater id (apps/mbui/scripts/mac-app.sh
  # MBUI_MAC_FROM), signed and notarized as monoid, put in monoid's bucket.
  monoid-desktop:
    needs: [plan, desktop]
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    runs-on: macos-26
    environment: production
    timeout-minutes: 5
    env:
      MBUI_FRESH: 1
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0, filter: "blob:none" } # its build is the commits in the history
      - uses: ./.github/actions/setup
      - name: Rename, sign and notarize still.fail's stable Mac app as monoid's, and put it in monoid's bucket
        env:
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          zip="stillfail-0.1.$(git rev-list --count HEAD)-arm64-mac.zip"
          curl -fsS -o "$RUNNER_TEMP/$zip" "https://app.still.fail/releases/desktop/$zip"
          export MBUI_MAC_FROM="$RUNNER_TEMP/$zip"
          sh .github/release-desktop.sh --product monoid --stable

  monoid-desktop-win:
    needs: [plan, desktop-win]
    if: ${{ !cancelled() && needs.desktop-win.result == 'success' && needs.desktop-win.outputs.monoid == '1' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "monoid-desktop-win-stable", path: "${{ runner.temp }}/monoid" }
      - name: Put it in monoid's bucket (its files and deltas, then its feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: |
          (cd cloud && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          node scripts/release-deltas.ts "$RUNNER_TEMP/monoid" --releases https://app.monoid.build/releases --deadline 150
          sh scripts/release-put.sh "$RUNNER_TEMP/monoid"

  # The app's page for a web built here (plan's web=build: a release branch's commit, never on beta, or a main commit
  # whose run changed no web and so kept no artifact), as the pipeline's mbui-web job builds it.
  mbui-web:
    needs: plan
    if: needs.plan.outputs.web == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/mbui-moonbit
      - run: bash apps/mbui/scripts/web-app.sh
      - uses: actions/upload-artifact@v4
        with: { name: "mbui-web-stable-${{ needs.plan.outputs.sha }}", path: web/public/mbui, retention-days: 1 }

  web:
    needs: [plan, android, desktop, desktop-win, mbui-web]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.desktop.result == 'success' && needs.desktop-win.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.mbui-web.result) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0, filter: "blob:none" }
      - uses: ./.github/actions/setup
      - run: cd cloud && pnpm install --frozen-lockfile --prefer-offline
      # web=build: built from the release's revision as the pipeline's static job builds main's (deploy.py, with the
      # same PostHog key), then deployed to app.still.fail as an artifact would be.
      - if: needs.plan.outputs.web == 'build'
        uses: actions/download-artifact@v4
        with: { name: "mbui-web-stable-${{ needs.plan.outputs.sha }}", path: web/public/mbui }
      - name: Build the release's web app and deploy it
        if: needs.plan.outputs.web == 'build'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: |
          sh .github/deploy.sh --dry-run web-beta
          test "$(node -p 'require("./dist/cloud-web/build.json").revision')" = "${{ needs.plan.outputs.sha }}"
          cd cloud && python3 deploy.py promote-web ../dist/cloud-web
      # monoid's web app built from the same revision and page as monoid-static builds main's, then put on
      # app.monoid.build: a release with fixes picked onto it (web=build) left monoid's web where it was (0.1.9870,
      # 0.1.10157). Not a reason to hold still.fail's release back.
      - name: Build the release's monoid web app and deploy it
        if: needs.plan.outputs.web == 'build'
        continue-on-error: true
        env:
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
        run: |
          # An older release's deploy.py gives `r2 object put` no CLOUDFLARE_ACCOUNT_ID: drop still.fail's account that
          # the step before cached for wrangler, else monoid's web.json put goes to still.fail's account (403).
          rm -rf cloud/node_modules/.cache/wrangler
          rm -rf dist/cloud-web
          sh .github/deploy.sh --dry-run web-beta
          test "$(node -p 'require("./dist/cloud-web/build.json").revision')" = "${{ needs.plan.outputs.sha }}"
          cd cloud && python3 deploy.py promote-web ../dist/cloud-web
      - name: Promote the same revision's original beta web artifact
        if: needs.plan.outputs.web == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_REVISION: ${{ needs.plan.outputs.sha }}
        run: python3 scripts/promote-web.py --revision "$RELEASE_REVISION"
      # monoid's web app (deploy.py CLOUDS), its own build of the same revision (pipeline.yml monoid-static). A revision
      # from before monoid has none: not a reason to hold still.fail's release back.
      - name: Promote the same revision's monoid web artifact
        if: needs.plan.outputs.web == 'artifact'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
          RELEASE_REVISION: ${{ needs.plan.outputs.sha }}
        run: |
          # An older release's deploy.py gives `r2 object put` no CLOUDFLARE_ACCOUNT_ID: drop still.fail's account that
          # the step before cached for wrangler, else monoid's web.json put goes to still.fail's account (403).
          rm -rf cloud/node_modules/.cache/wrangler
          python3 scripts/promote-web.py --revision "$RELEASE_REVISION"

  # The station's native parts of the release's revision, each where the release or the store (natives/: main's
  # natives-store copies the release's there, which keeps only 20 of a part, a few hours of main's) has it or else
  # built and published here, beside the apps' builds, so that the station job only fetches them: there, the readers of
  # the day before's main, found in neither, were built one after another on Mini1 and the job cut at its 10 minutes
  # every run (2026-11-19). Seconds when all are there. The release's checkout is older than this workflow, its
  # native.ts maybe one that asks the release alone: what is in either is asked here, and only what neither has is
  # given to its `ensure --publish`. Linux's and Windows' on ci-1 (the readers' C, one job after the other: `needs:`
  # chains station-natives-linux -> station-natives-win -> station-natives-linux-arm64), the Apple ones on Mini1. Not a
  # shared concurrency group, which holds one running and one pending: in 44922872509 station-natives-win finished
  # first while station-natives-linux was pending, station-natives-linux-arm64 entered the group and cancelled it.
  station-natives-linux:
    needs: plan
    runs-on: ${{ fromJSON(vars.CI_1 != 'off' && '["self-hosted", "linux-ci"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: write # the release native-artifacts' assets
    env:
      WANT: >-
        reader:linux-x64 launcher:linux-x64 mesh:linux-x64 runner:linux-x64 screen-linux:linux-x64 launcher:win32-x64
        mesh:win32-x64 runner:win32-x64 screen:win32-x64 agent-desktop:win32-x64
    steps: &station-natives-linux-steps
      - if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      # (the pinned Node: ci-1's from setup-linux, before anything runs node)
      - if: runner.environment == 'self-hosted'
        uses: ./.github/actions/setup-linux
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/node
      - &station-natives-missing
        id: missing
        name: What neither the store nor the release has
        run: |
          missing=""
          for want in $WANT; do
            # (a part the release's revision does not have yet, as screen-linux before #7581: not its station's. Any
            # other failure stops the job: never taken for "nothing missing". Not `native.ts parts`: newer than some
            # revisions released)
            if ! k=$(node scripts/native.ts key "${want%%:*}" "${want#*:}" 2> "$RUNNER_TEMP/key.err"); then
              if grep -q "no such part: ${want%%:*} " "$RUNNER_TEMP/key.err"; then echo "$want: not a part of this revision"; continue; fi
              cat "$RUNNER_TEMP/key.err" >&2; exit 1
            fi
            name="${want%%:*}-${want#*:}-$k.tar.gz"
            # (the store answers GET, ranges too, not HEAD; the release's download a redirect)
            if curl -fs --max-time 30 -r 0-0 -o /dev/null "https://app.still.fail/releases/natives/$name"; then echo "$name: in the store"
            elif curl -fsI --max-time 30 -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/native-artifacts/$name"; then echo "$name: in the release"
            else echo "$name: in neither, built here"; missing="$missing $want"; fi
          done
          echo "list=$missing" >> "$GITHUB_OUTPUT"
      - if: steps.missing.outputs.list != ''
        uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc' }
      - name: Zig 0.16.0 (the reader's cc on GitHub's Linux)
        if: steps.missing.outputs.list != '' && runner.environment != 'self-hosted'
        run: |
          d="$RUNNER_TOOL_CACHE/zig-0.16.0/zig-x86_64-linux-0.16.0"
          if [ ! -x "$d/zig" ]; then
            mkdir -p "$RUNNER_TOOL_CACHE/zig-0.16.0"
            t="$RUNNER_TEMP/zig.tar.xz"
            curl -fsSL --retry 5 --retry-all-errors --speed-limit 1024 --speed-time 20 -o "$t" https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $t" | sha256sum -c --quiet
            tar -xf "$t" -C "$RUNNER_TOOL_CACHE/zig-0.16.0"
            rm -f "$t"
          fi
          [ "$("$d/zig" version)" = 0.16.0 ]
          echo "$d" >> "$GITHUB_PATH"
      - &station-natives-ensure
        name: Build and publish what neither has
        if: steps.missing.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ steps.missing.outputs.list }}
        run: |
          # (the readers side by side share the cores, as the pipeline's natives)
          r=$(printf '%s\n' $MISSING | grep -c '^reader:' || true)
          [ "$r" -ge 1 ] || r=1
          [ "$r" -le 3 ] || r=3
          # shellcheck disable=SC2086 # part:target words
          STILLFAIL_NATIVE_READERS=$r node scripts/native.ts ensure --publish $MISSING

  # The arm64 parts apart, as Windows' reader: a release's readers are in main's store only where main built the same
  # revision's, never for one with fixes picked onto it, and two cold readers in one job were more than its 5 minutes.
  # Last of the `needs:` chain station-natives-linux -> station-natives-win -> station-natives-linux-arm64, whatever
  # the one before came to (the chain's reason is above station-natives-linux).
  station-natives-linux-arm64:
    needs: [plan, station-natives-win]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_1 != 'off' && '["self-hosted", "linux-ci"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: write # the release native-artifacts' assets
    env:
      WANT: reader:linux-arm64 launcher:linux-arm64 mesh:linux-arm64 runner:linux-arm64 screen-linux:linux-arm64
    steps: *station-natives-linux-steps

  station-natives-win:
    needs: [plan, station-natives-linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_1 != 'off' && '["self-hosted", "linux-ci"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      contents: write # the release native-artifacts' assets
    env:
      WANT: reader:win32-x64
    steps: *station-natives-linux-steps

  station-natives-mac:
    needs: plan
    runs-on: [self-hosted, macos-ci]
    timeout-minutes: 5
    permissions:
      contents: write # the release native-artifacts' assets
    env:
      WANT: reader:darwin-arm64 launcher:darwin-arm64 mesh:darwin-arm64 runner:darwin-arm64 helper:darwin-arm64
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}' }
      - uses: ./.github/actions/setup-mac
      - *station-natives-missing
      - if: steps.missing.outputs.list != ''
        uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc' }
      - *station-natives-ensure

  # Offer compatible apps before making the station update available. Built and signed as the pipeline's station job
  # builds the beta's, on GitHub's Mac (on Mini1, its uploads over the home line were cut at five minutes, 2026-11-17),
  # into a directory (RELEASE_DIR) whose files are staged in the bucket (staged/…: release-put.sh --stage, --hand), never
  # under the names stations install: station-put puts them, after the deltas to them, packages and feed within
  # seconds. A run cut before that leaves the stable channel as it was (2026-11-19: put one by one as they were packed,
  # a cut run left new packages beside the old station.json for 20 minutes). Its native parts only fetched
  # (station-natives-*).
  station:
    needs: [plan, web, station-natives-linux, station-natives-linux-arm64, station-natives-win, station-natives-mac]
    # web needs mbui-web, skipped when web=artifact; without this, the default success() over a skipped ancestor skips
    # this job and everything after it (0.1.8278, 2026-11-12).
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.station-natives-linux.result == 'success' && needs.station-natives-linux-arm64.result == 'success' && needs.station-natives-win.result == 'success' && needs.station-natives-mac.result == 'success' }}
    runs-on: macos-26
    environment: production
    timeout-minutes: 5
    outputs:
      hand: ${{ steps.hand.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0, filter: "blob:none" } # the release's number is the commits in the history
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/natives
      # (MoonBit for the station's reader, station/mb/build.sh, where one is not prebuilt after all: mbc alone of mbui's
      # tools)
      - uses: ./.github/actions/mbui-moonbit
        with: { tools: 'mbc' }
      # (the Node each platform's release names, kept by scripts/node-dist.sh: nodejs.org's tarballs and the packages
      # made of them)
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/stillfail-build/station-ts/node
          key: station-node-dist-${{ hashFiles('.node-version') }}
      - name: Build the stable station's release (darwin-arm64, linux-x64, linux-arm64, win32-x64) into a directory
        env:
          GH_TOKEN: ${{ github.token }}
          POSTHOG_JSON: ${{ secrets.POSTHOG_JSON }}
          # AFK's Developer ID (.github/mac_signing.py): the native parts are signed with it, as the beta's are; without
          # it the stable station went out ad hoc (2026-11-02's).
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_1: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_1 }}
          MACOS_DEVELOPER_ID_KEYCHAIN_B64_2: ${{ secrets.MACOS_DEVELOPER_ID_KEYCHAIN_B64_2 }}
          KEYCHAIN_PASSWORD_AFK: ${{ secrets.KEYCHAIN_PASSWORD_AFK }}
          # The key the release is signed with (scripts/release-sign.ts): none is an error.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: sh .github/release.sh --stable station
      # (this workflow's release-put.sh: the checkout is the release's, which can be older)
      - name: Stage its files in the bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          git cat-file -e "$GITHUB_SHA:scripts/release-put.sh" 2>/dev/null || git fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:scripts/release-put.sh" > "$RUNNER_TEMP/release-put.sh"
          STILLFAIL_RELEASE_TOOLS_ROOT="$GITHUB_WORKSPACE" sh "$RUNNER_TEMP/release-put.sh" --stage "$RUNNER_TEMP/release"
      - id: hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          STILLFAIL_RELEASE_TOOLS_ROOT="$GITHUB_WORKSPACE" sh "$RUNNER_TEMP/release-put.sh" --hand "$RUNNER_TEMP/release" | tee "$RUNNER_TEMP/hand.out"
          echo "key=$(tail -1 "$RUNNER_TEMP/hand.out")" >> "$GITHUB_OUTPUT"

  # The deltas to the stable station from the stable builds before it, a job a platform, as the pipeline's
  # deltas-station makes the beta's (this workflow's scripts: release-deltas.ts takes station.json as the stable
  # channel's): the archives under their own names (station/archive/stable/…) and the deltas put, nothing pointing at
  # them until station-put writes the feed. Never a reason to hold the release back.
  deltas-station:
    needs: [plan, station]
    if: ${{ !cancelled() && needs.station.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64, linux-x64, linux-arm64, win32-x64]
    env:
      PLATFORM: ${{ matrix.platform }}
      HANDED: ${{ needs.station.outputs.hand }}
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/
            /shared/delta.ts
            /.node-version
            /.github/actions/node/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/node
      - name: Its release, as station-put will have it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --unhand "$RUNNER_TEMP/release" $HANDED
          # (a station platform's job takes back its own package alone)
          STILLFAIL_UNSTAGE_MATCH="${PLATFORM:-}" sh scripts/release-put.sh --unstage "$RUNNER_TEMP/release"
      # (a deadline of its own, inside the job's: what is not made by then is left out, the job green)
      - name: Its deltas
        run: node scripts/release-deltas.ts "$RUNNER_TEMP/release" --into "$RUNNER_TEMP/deltas" --deadline 200 --platform "$PLATFORM"
      - name: Put them (nothing points at them until station-put writes the feed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh scripts/release-put.sh --files "$RUNNER_TEMP/deltas"
      - uses: actions/upload-artifact@v4
        with: { name: "deltas-station-stable-${{ matrix.platform }}-${{ needs.plan.outputs.sha }}", path: "${{ runner.temp }}/deltas", if-no-files-found: ignore, retention-days: 1 }

  # The stable station out: its staged files taken back, its platforms' deltas merged into station.json, then the four
  # packages side by side and station.json last (release-put.sh: files, then feeds), seconds apart.
  station-put:
    needs: [plan, station, deltas-station]
    if: ${{ !cancelled() && needs.station.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    env:
      HANDED: ${{ needs.station.outputs.hand }}
    steps:
      - run: sudo -n sysctl -qw net.ipv4.tcp_syn_retries=3 || true
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/
            /shared/delta.ts
            /.node-version
            /.github/actions/node/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/node
      - name: What the station job handed over
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --unhand "$RUNNER_TEMP/release" $HANDED
      # (each platform's deltas, its job's; none, and the feed goes out as it was handed)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "deltas-station-stable-*-${{ needs.plan.outputs.sha }}", path: "${{ runner.temp }}/release", merge-multiple: true }
      - name: The station's deltas in its feed
        run: node scripts/release-deltas.ts --merge "$RUNNER_TEMP/release"
      - name: Put the stable station (its files, then station.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sh scripts/release-put.sh "$RUNNER_TEMP/release"
          # shellcheck disable=SC2086 # names, one word each
          sh scripts/release-put.sh --drop $HANDED

  # The official site, still.fail, from the same revision: the pipeline deploys only youdid.wtf's (site-beta), and a
  # stable release that left it out kept still.fail at 2026-10-01's for two weeks (no Windows download on it).
  site:
    needs: [plan, web]
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: [self-hosted, macos-ci]
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - uses: ./.github/actions/setup-mac
      - name: Deploy still.fail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: sh .github/deploy.sh site
      # monoid's, monoid.build (website/build.mjs SITES: the template's own, its links its cloud's): not a reason to hold
      # still.fail's release back
      - name: Deploy monoid.build
        continue-on-error: true
        env:
          STILLFAIL_CLOUD: monoid
          CLOUDFLARE_API_TOKEN: ${{ secrets.MONOID_CLOUDFLARE_API_TOKEN }}
        run: sh .github/deploy.sh site

  done:
    needs: [plan, android, android-feeds, desktop, desktop-win, desktop-win-feeds, web, station, station-put, site]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.station.result == 'success' && needs.station-put.result == 'success' && needs.site.result == 'success' && needs.android-feeds.result == 'success' && needs.desktop-win-feeds.result == 'success' }}
    runs-on: [self-hosted, macos-ci]
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write # the clouds believe it as it tells them a release is out (scripts/release-told.sh)
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false, ref: '${{ needs.plan.outputs.sha }}', fetch-depth: 0 }
      - name: Record the fully published stable revision
        env:
          RELEASE_REVISION: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git tag -f deployed/stable "$RELEASE_REVISION"
          # As macos-ci's own GitHub login, not the run's token: GitHub refuses that token a ref to a commit that changes a
          # workflow (no `workflows` permission), and a tag stuck behind such a commit stays stuck (2026-10-02, e3ae7c10).
          # (again on a dropped connection: one from macos-ci to github.com failed the tag's push alone, the beta out, main
          # 30f68adc 41249459343, 2026-11-01)
          for i in 1 2 3; do
            git push --no-verify -f "https://github.com/$GITHUB_REPOSITORY" refs/tags/deployed/stable && break
            [ $i = 3 ] && exit 1; sleep 10
          done
          echo "Published stable 0.1.$RELEASE_VERSION from $RELEASE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      # (inline: this checkout is the release's revision, which can be older than scripts/release-told.sh)
      - name: Tell the clouds the release is out (their stations and apps read their feeds then)
        run: |
          for origin in https://app.still.fail https://app.youdid.wtf; do
            token=$(curl -fsS -H "authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$origin" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || token=""
            if [ -n "$token" ] && curl -fsS --retry 3 -X POST -H "authorization: Bearer $token" "$origin/v1/releases/out" > /dev/null; then echo "$origin told"; else echo "$origin not told" >&2; fi
          done

# MoonBit for a job, as the moonbit workflow put its latest release in the Actions cache (each release once, by its
# downloads' ETags): restored, never downloaded here. No cached release for this runner's OS and architecture: the job
# fails saying so (run the moonbit workflow), not a download that now and then breaks off (cli.moonbitlang.com's
# SSL_ERROR_SYSCALL, 2026-10-20). Into the runner's own tool cache (moon-ci). MOON_HOME and PATH for the
# steps after it; `moon version --all` said.
name: MoonBit
description: The latest MoonBit, from the cache the moonbit workflow fills
inputs:
  tools:
    description: Tools to restore and build
    default: 'mbc chk detlint apk testexe'
runs:
  using: composite
  steps:
    # Disk upkeep on a self-hosted Mac (setup-mac/upkeep.sh), as setup-mac does, for the mbui jobs that do not use
    # setup-mac (mbui-host-ios, -mac, render-mac): once an hour, or at each job start below 15 GiB free.
    - if: runner.environment == 'self-hosted' && runner.os == 'macOS'
      shell: bash
      run: |
        [ -f "$GITHUB_WORKSPACE/.github/actions/setup-mac/upkeep.sh" ] || exit 0
        upkeep="$HOME/stillfail-ci/.upkeep"
        free_kb=$(df -Pk / | awk 'NR==2 {print $4}')
        if [ "${free_kb:-0}" -lt 15728640 ] || [ -z "$(find "$upkeep" -mmin -60 2>/dev/null)" ]; then
          mkdir -p "$HOME/stillfail-ci" && touch "$upkeep"
          sh "$GITHUB_WORKSPACE/.github/actions/setup-mac/upkeep.sh" "$GITHUB_WORKSPACE" || echo "::warning::macos-ci disk upkeep failed"
        fi
    # The newest release put in, looked up only: nothing downloaded yet
    - uses: actions/cache/restore@v4
      id: newest
      with:
        # (in the runner's own tool cache: two runners on one machine (macos-ci's) shared ~/.moon-ci, and one's restore wrote
        # over the MoonBit the other's tests were running with: moon test said nothing, run 39532570138. A self-hosted
        # runner's put in and taken out at moon-ci-put, in its workspace, then moved there: an entry is found only by the
        # path it was saved at, as written, and each of macos-ci's runners has a tool cache of its own, so only the one the
        # moonbit workflow put it in from ever found it, the others failing at each new release once theirs was gone:
        # main's web deploy on macos-ci-2, twice, 2026-10-31, 41173735373)
        path: ${{ runner.environment == 'self-hosted' && 'moon-ci-put' || format('{0}/moon-ci', runner.tool_cache) }}
        # (no key is this one: the newest of this prefix, the latest release the moonbit workflow put in)
        key: moonbit-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-none
        restore-keys: moonbit-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
        lookup-only: true
    # A self-hosted runner's tool cache stays from one job to the next: the release restored there before (its key in
    # moon-ci.key beside it) is not downloaded again. macos-ci's mbui jobs each took the same ~104 MB from the Actions
    # cache through the proxy its DNS sends GitHub to, ~13 GB a day (2026-10-23). GitHub's runners start with none.
    - id: kept
      shell: bash
      env:
        KEY: ${{ steps.newest.outputs.cache-matched-key }}
      run: |
        t="$RUNNER_TOOL_CACHE"; [ "${{ runner.os }}" != Windows ] || t=$(cygpath -u "$t")
        if [ -n "$KEY" ] && [ "$(cat "$t/moon-ci.key" 2>/dev/null)" = "$KEY" ] && { [ -x "$t/moon-ci/bin/moon" ] || [ -x "$t/moon-ci/bin/moon.exe" ]; }; then
          echo "MoonBit $KEY kept in the tool cache: not downloaded again"
          echo "kept=true" >> "$GITHUB_OUTPUT"
        fi
    # (its key said only once it is restored: a download that breaks off is a warning of actions/cache's, the files
    # left as they were)
    - if: steps.newest.outputs.cache-matched-key != '' && steps.kept.outputs.kept != 'true'
      shell: bash
      run: |
        t="$RUNNER_TOOL_CACHE"; [ "${{ runner.os }}" != Windows ] || t=$(cygpath -u "$t")
        rm -f "$t/moon-ci.key"
    - if: steps.newest.outputs.cache-matched-key != '' && steps.kept.outputs.kept != 'true'
      uses: actions/cache/restore@v4
      id: moon
      with:
        path: ${{ runner.environment == 'self-hosted' && 'moon-ci-put' || format('{0}/moon-ci', runner.tool_cache) }}
        key: ${{ steps.newest.outputs.cache-matched-key }}
    - shell: bash
      env:
        KEY: ${{ steps.newest.outputs.cache-matched-key }}
        RESTORED: ${{ steps.moon.outputs.cache-matched-key }}
      run: |
        t="$RUNNER_TOOL_CACHE"; [ "${{ runner.os }}" != Windows ] || t=$(cygpath -u "$t")
        m="$t/moon-ci"
        # (a self-hosted runner's, restored in its workspace: moved into its tool cache, over the release kept there)
        if [ -d moon-ci-put ]; then rm -rf "$m" && mv moon-ci-put "$m"; fi
        if [ ! -x "$m/bin/moon" ] && [ ! -x "$m/bin/moon.exe" ]; then
          echo "::error::no MoonBit for ${{ runner.os }} ${{ runner.arch }} in the Actions cache: run the moonbit workflow (it puts each new release in once)"
          exit 1
        fi
        [ -z "$KEY" ] || [ "$RESTORED" != "$KEY" ] || printf '%s' "$KEY" > "$t/moon-ci.key"
        echo "MoonBit: $KEY"
        if [ "${{ runner.os }}" = Windows ]; then m=$(cygpath -w "$m"); echo "$m\\bin" >> "$GITHUB_PATH"; else echo "$m/bin" >> "$GITHUB_PATH"; fi
        echo "MOON_HOME=$m" >> "$GITHUB_ENV"
    - shell: bash
      run: |
        [ ! -f libs/ui/scripts/env.sh ] || . libs/ui/scripts/env.sh
        moon version --all
    # mbui's tools (scripts/mbc, chk, detlint, apk, and pack, the packager scripts/mbui runs: each built when there is none built from its own sources, by content)
    # kept here each by its own key, what its script says it is built from (`scripts/<tool> key`), the tool's program
    # alone: a job saves only the tools it ran, each built from the sources its key names, so a key restored is a tool
    # up to date. (Kept together by a hash of all tools/, a key was saved by the job that ended first, with the tools
    # that job never ran as stale as what it had restored: main's android job built mbc and chk again in every run,
    # 65 s of its 185, a key restored that had neither from its sources, 2026-10-25, 40141156498.)
    - id: tools
      shell: bash
      # (none in a checkout without mbui's tools: nothing kept. On ci-1's self-hosted Linux runners, kept on local disk
      # under ~/stillfail-ci/mbui-tools instead of five Actions cache round-trips per job)
      run: |
        [ -d libs/ui/tools ] || exit 0
        . libs/ui/scripts/env.sh
        if [ "${{ runner.environment }}" = self-hosted ] && [ "${{ runner.os }}" = Linux ]; then
          store="$HOME/stillfail-ci/mbui-tools"
          mkdir -p "$store"
          keep_tool() {
            local name=$1 script=$2 out=$3 k dir tmp
            k=$($script key)
            dir="$store/$name-$k"
            if [ ! -f "$dir/bin" ] || [ ! -f "$dir/src" ]; then
              if [ "$name" = testexe ]; then bash "$script" path >/dev/null; else sh "$script" path >/dev/null; fi
              if [ -f "$out" ] && [ -f "$out.src" ]; then
                tmp="$store/.tmp-$name-$$"
                rm -rf "$tmp" && mkdir -p "$tmp"
                cp -a "$out" "$tmp/bin" && cp -a "$out.src" "$tmp/src"
                mv -n "$tmp" "$dir" 2>/dev/null || rm -rf "$tmp"
              fi
            fi
            if [ -f "$dir/bin" ] && [ -f "$dir/src" ]; then
              mkdir -p "$(dirname "$out")"
              cp -a "$dir/bin" "$out" && cp -a "$dir/src" "$out.src"
            fi
          }
          for t in mbc chk detlint apk; do
            case " ${{ inputs.tools }} " in *" $t "*) ;; *) continue ;; esac
            keep_tool "$t" "libs/ui/scripts/$t" "libs/ui/tools/_build/native/release/build/$t/$t.exe"
          done
          if [[ " ${{ inputs.tools }} " == *" pack "* ]]; then
            keep_tool pack "libs/ui/scripts/ui" "libs/ui/tools/_build/native/release/build/pack/pack.exe"
          fi
          if [[ " ${{ inputs.tools }} " == *" testexe "* ]] && [ -f apps/mbui/scripts/testexe ]; then
            keep_tool testexe "apps/mbui/scripts/testexe" "apps/mbui/tools/_build/native/release/build/sftools/testexe/testexe.exe"
          fi
          find "$store" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + 2>/dev/null || true
          exit 0
        fi
        for t in mbc chk detlint apk; do
          case " ${{ inputs.tools }} " in *" $t "*) echo "$t=$(sh libs/ui/scripts/$t key)" >> "$GITHUB_OUTPUT" ;; esac
        done
        [[ " ${{ inputs.tools }} " != *" pack "* ]] || echo "pack=$(sh libs/ui/scripts/ui key)" >> "$GITHUB_OUTPUT"
        # (the app's: scripts/testexe, a test program's runs for scripts/test.sh)
        [[ " ${{ inputs.tools }} " != *" testexe "* ]] || [ ! -f apps/mbui/scripts/testexe ] || echo "testexe=$(bash apps/mbui/scripts/testexe key)" >> "$GITHUB_OUTPUT"
    - if: steps.tools.outputs.mbc != ''
      uses: actions/cache@v4
      with:
        path: |
          libs/ui/tools/_build/native/release/build/mbc/mbc.exe
          libs/ui/tools/_build/native/release/build/mbc/mbc.exe.src
        key: mbui-tool-mbc-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.mbc }}
    - if: steps.tools.outputs.testexe != ''
      uses: actions/cache@v4
      with:
        path: |
          apps/mbui/tools/_build/native/release/build/sftools/testexe/testexe.exe
          apps/mbui/tools/_build/native/release/build/sftools/testexe/testexe.exe.src
        key: mbui-tool-testexe-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.testexe }}
    - if: steps.tools.outputs.chk != ''
      uses: actions/cache@v4
      with:
        path: |
          libs/ui/tools/_build/native/release/build/chk/chk.exe
          libs/ui/tools/_build/native/release/build/chk/chk.exe.src
        key: mbui-tool-chk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.chk }}
    - if: steps.tools.outputs.detlint != ''
      uses: actions/cache@v4
      with:
        path: |
          libs/ui/tools/_build/native/release/build/detlint/detlint.exe
          libs/ui/tools/_build/native/release/build/detlint/detlint.exe.src
        key: mbui-tool-detlint-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.detlint }}
    - if: steps.tools.outputs.apk != ''
      uses: actions/cache@v4
      with:
        path: |
          libs/ui/tools/_build/native/release/build/apk/apk.exe
          libs/ui/tools/_build/native/release/build/apk/apk.exe.src
        key: mbui-tool-apk-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.apk }}
    - if: steps.tools.outputs.pack != ''
      uses: actions/cache@v4
      with:
        path: |
          libs/ui/tools/_build/native/release/build/pack/pack.exe
          libs/ui/tools/_build/native/release/build/pack/pack.exe.src
        key: mbui-tool-pack-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.pack }}
    # Put these in the cache's path before an app sets MBUI_TOOLS_OUT. A cold key is built once;
    # a restored key already has the matching .src and is returned without a build.
    - shell: bash
      run: |
        [ -d libs/ui/tools ] || exit 0
        . libs/ui/scripts/env.sh
        unset MBUI_TOOLS_OUT
        for t in mbc chk; do
          case " ${{ inputs.tools }} " in *" $t "*) sh "libs/ui/scripts/$t" path >/dev/null ;; esac
        done
        [[ " ${{ inputs.tools }} " != *" pack "* ]] || sh libs/ui/scripts/ui path >/dev/null
